schema_version: 1
kind: interfaces
id: div-12
title: Interfaces involving Division 12
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

# An edge carries `failure` only when no failure_mode already names it in caught_by.
# Edges with Divisions 03-11 (slab recesses, backing, window frames, ceilings,
# equipment) belong to those divisions' files; the casework edges below predate that rule.

edges:
  - id: if.casework-backing
    a: ["12 30 00", "06 41 00"]
    a_trade: Casework
    b: ["06 10 53", "09 22 16", "05 50 00"]
    b_trade: Framing / rough carpentry / misc. metals
    a_provides: In-wall supports and backing per elevation — type, location, height, load, bracket model
    b_provides: Backing type for each wall assembly; confirmation it is installed and inspected before close-in
    responsibility:
      - item: Concealed in-wall brackets for wall-hung counters
        typical: {furnish: "12 30 00", install: "06 10 53 or 09 22 16"}
        confirm_in: [spec.part1, drawings.details]
    gate: {milestone: wall_close_in, note: Before second-side gypsum board}
    severity: critical
    failure: Backing or brackets missed; finished walls opened after drywall

  - id: if.casework-plumbing
    a: ["12 30 00", "06 41 00"]
    a_trade: Casework
    b: ["22 40 00"]
    b_trade: Plumbing
    a_provides: Sink and faucet cutouts, bowl depth limits, access panels, knee-space and pipe-protection conditions
    b_provides: Approved fixture models and cut sheets, rough-in heights and locations for supply and waste
    responsibility:
      - item: Sinks and faucets in casework tops
        typical: {furnish: "22 40 00", install: "12 30 00 or 22 40 00", connect: "22 40 00"}
        confirm_in: [spec.part1, schedule.plumbing_fixture]
    gate: {milestone: in_wall_rough_in}
    severity: high

  - id: if.casework-electrical
    a: ["12 30 00", "06 41 00"]
    a_trade: Casework
    b: ["26 27 26", "26 51 00"]
    b_trade: Electrical
    a_provides: Device and light cutouts, backsplash heights, wiring chases and access
    b_provides: Device locations and heights, under-cabinet fixture models and drivers
    gate: {milestone: in_wall_rough_in}
    severity: high

  - id: if.casework-base
    a: ["12 30 00", "06 41 00"]
    a_trade: Casework
    b: ["09 65 13"]
    b_trade: Resilient flooring
    a_provides: Toe kick height and finish
    b_provides: Base type at casework
    responsibility:
      - item: Base at casework toe kicks
        typical: {furnish: "09 65 13", install: "09 65 13"}
        confirm_in: [drawings.details, schedule.finish]
    gate: {milestone: equipment_set}
    severity: low
    failure: Nobody carries base at casework; punch list item with no owner

  - id: if.lab-casework-fume-hoods
    a: ["12 35 53"]
    a_trade: Laboratory casework
    b: ["11 53 13"]
    b_trade: Fume hoods
    a_provides: Base cabinets and work surface under each hood, cutouts for hood services
    b_provides: Hood dimensions, service locations, sash clearance, weight
    gate: {milestone: procurement_release, note: Review hood and casework shops together}
    severity: high
    failure: Hood size changed; base cabinets and tops built to the old size

  - id: if.lab-casework-services
    a: ["12 35 53"]
    a_trade: Laboratory casework
    b: ["22 63 00", "22 40 00"]
    b_trade: Laboratory gases and plumbing
    a_provides: Service fixture types and locations on casework and tops
    b_provides: Piping rough-in to each fixture; connection scope
    responsibility:
      - item: Laboratory service fixtures (turrets, valves, outlets)
        typical: {furnish: "12 35 53", install: "12 35 53", connect: "22 63 00"}
        confirm_in: [spec.part1, drawings.lab_gas]
    gate: {milestone: in_wall_rough_in}
    severity: high
    failure: Fixtures furnished twice or not at all; final connections missed

  - id: if.lab-casework-exhaust
    a: ["12 35 53"]
    a_trade: Laboratory casework
    b: ["23 31 00"]
    b_trade: HVAC ductwork
    a_provides: Ventilated storage cabinet locations and vent connection sizes
    b_provides: Exhaust connection or confirmation that cabinets stay unvented
    gate: {milestone: above_ceiling_close_in}
    severity: high
    failure: Vented cabinets with no exhaust path

  - id: if.lab-casework-eyewash
    a: ["12 35 53"]
    a_trade: Laboratory casework
    b: ["22 45 00"]
    b_trade: Emergency plumbing fixtures
    a_provides: Top cutouts and access for deck-mounted eyewash and drench hose
    b_provides: Fixture models, supply and tempering
    gate: {milestone: in_wall_rough_in}
    severity: medium
    failure: Eyewash with no cutout or blocked by casework

  - id: if.casework-headwall
    a: ["12 30 00", "06 41 00"]
    a_trade: Casework
    b: ["22 63 00", "27 52 23"]
    b_trade: Medical gas / nurse call
    a_provides: Casework extents at patient care locations
    b_provides: Outlet and device locations at headwalls and care stations
    gate: {milestone: in_wall_rough_in}
    severity: medium
    failure: Upper cabinets or countertops cover medical gas outlets or nurse call devices
    facility_types: [healthcare]

  # ── Window treatments ─────────────────────────────────────────
  - id: if.12-motorized-shades-power
    a: ["12 20 00"]
    a_trade: Window treatments
    b: ["26 05 33", "26 05 83", "26 09 23"]
    b_trade: Electrical and lighting controls
    a_provides: Motor voltage and locations, power supply and panel locations, control wiring diagram, keypad and sensor locations, and the integration protocol
    b_provides: Circuits and boxes at each head or pocket and power supply, conduit for control wiring, and the lighting-control interface
    responsibility:
      - item: Low-voltage shade control wiring and keypads
        typical: {furnish: "12 20 00", install: "12 20 00 or 26 05 33", connect: "12 20 00"}
        confirm_in: [spec.part1, drawings.electrical]
      - item: Programming and commissioning of shade groups and integration
        typical: {install: "12 20 00 or 26 09 23"}
        confirm_in: [spec.part1, spec.part3]
    gate: {milestone: in_wall_rough_in}
    severity: high

  - id: if.12-shade-pockets-sprinklers
    a: ["12 20 00"]
    a_trade: Window treatments
    b: ["21 13 00"]
    b_trade: Sprinklers
    a_provides: Pocket, fascia and drapery track locations, widths and depths along each window wall
    b_provides: Sprinkler positions relative to the pockets, and sprinklers inside pockets where the pocket would obstruct discharge
    gate: {milestone: above_ceiling_close_in}
    severity: medium

  # ── Furniture and seating ─────────────────────────────────────
  - id: if.12-furniture-power-data
    a: ["12 50 00"]
    a_trade: Furniture
    b: ["26 05 33", "26 27 26", "27 10 00", "27 41 00"]
    b_trade: Electrical, structured cabling and audiovisual
    a_provides: Furniture plan with feed points and feed types, the furniture power system's circuit arrangement, data drops per cluster, and table cutouts for power and AV modules
    b_provides: Floor boxes, poke-throughs, power poles and wall feeds at those points with the circuits and cabling they need, and AV inserts for conference tables
    responsibility:
      - item: Final connection of systems furniture to the building feed
        typical: {install: "12 50 00", connect: "26 27 26"}
        confirm_in: [spec.part1, drawings.electrical]
      - item: Power and AV modules in conference tables
        typical: {furnish: "12 50 00 or 27 41 00", install: "12 50 00 or 27 41 00"}
        confirm_in: [spec.part1, drawings.technology]
    gate:
      milestone: slab_pour
      note: Floor boxes in slabs on grade are set at the pour; later layouts mean cores
    severity: high

  - id: if.12-seating-aisle-power
    a: ["12 60 00"]
    a_trade: Multiple seating
    b: ["26 05 33", "26 51 00"]
    b_trade: Electrical raceway and interior lighting
    a_provides: Aisle and step light locations on seat ends and risers, and power needs of motorized telescoping stands
    b_provides: Conduit and boxes cast into risers at those locations, and circuits and controls for the stands
    gate: {milestone: slab_pour}
    severity: medium

  # ── Rugs and mats ─────────────────────────────────────────────
  - id: if.12-mat-recess-drains
    a: ["12 48 00"]
    a_trade: Entrance mats and grilles
    b: ["22 13 00", "22 14 00"]
    b_trade: Sanitary and storm drainage
    a_provides: Recess locations, depths and pan details that need drainage
    b_provides: Drain bodies and piping at each drained recess, set before the slab pour
    gate: {milestone: slab_pour}
    severity: medium
