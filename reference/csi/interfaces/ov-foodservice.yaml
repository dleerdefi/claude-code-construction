# Facility-filtered edges. Equipment-to-trade edges for kitchens (plumbing,
# power, gas and exhaust, hood suppression and fire alarm, walk-ins) live in
# div-11.yaml. Grease duct construction itself is 23dt.grease-duct (23 31 00).
# An edge carries `failure` only when no failure mode covers it.

edges:
  - id: if.food-grease-duct-enclosure
    a: ["23 31 00", "23 38 13"]
    a_trade: Grease duct and kitchen hood exhaust
    b: ["09 21 16", "09 29 00", "08 31 00"]
    b_trade: Shaft wall assemblies and access doors
    a_provides: Grease duct route, cleanout locations and sizes, the clearance the duct needs to its enclosure, where it enters and leaves the shaft, and the date its leakage test can be witnessed
    b_provides: Rated shaft built to that clearance with no other services inside, rated access doors aligned with every cleanout, and the shaft closed only after the duct's leakage test; where a listed wrap or factory-built enclosure replaces the shaft, its listing's clearances and access panels instead
    responsibility:
      - item: Rated access doors in the shaft at grease duct cleanouts
        typical: {furnish: "08 31 00 or 23 31 00", install: "09 21 16"}
        confirm_in: [spec.part1, drawings.details]
    gate:
      milestone: above_ceiling_close_in
      note: Shafts are closed as they are built; access door framing at each cleanout goes in with the shaft wall
      inspect_before:
        - Grease duct leakage test witnessed by the code official before the enclosure conceals the duct
    severity: high
    facility_types: [foodservice]
