schema_version: 1
kind: section
id: "12 35 70"
title: Healthcare Casework
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

equivalents: ["12 32 00", "06 41 00"]

scope_summary: >
  Casework for clinics and hospitals, often modular or frame-and-panel
  systems with wall rails, mobile units, and integral solid-surface tops and
  sinks. On top of casework review and the healthcare facility rules, the
  distinct risk is medical equipment built into or under the casework
  (medication dispensing cabinets, blanket and fluid warmers, monitored
  refrigerators, ice dispensers) that the owner's equipment planner selects
  late, and that needs an opening, power, data and sometimes plumbing or
  ventilation at the casework.

review_checks:
  - id: 12hc.equipment-integration
    kind: coordination
    check: >
      Each equipment item built into or under the casework is sized to the
      equipment planner's current model, with its power, emergency power,
      data, plumbing and ventilation clearance at the casework; items still
      unselected are listed with the date the casework release needs them.
    trace_to: [schedule.equipment, drawings.equipment, drawings.interior_elevations]
    severity: high
    owner: gc
    gate: in_wall_rough_in

  - id: 12hc.wall-rail-systems
    kind: constructability
    check: >
      Rail-hung and modular systems show the rail or standard heights along
      each wall, continuous backing for the full run (not only behind the
      cabinets drawn today), and the loads the rails carry; mobile units show
      their parking positions and clearances under fixed counters.
    trace_to: [drawings.interior_elevations, drawings.details]
    severity: high
    owner: subcontractor
    gate: wall_close_in

reconciliations:
  - id: 12hc.rc.equipment-list
    between: [schedule.equipment, drawings.interior_elevations, drawings.electrical]
    key: Equipment item at the casework
    fields: [model, opening dimensions, power and emergency power, data, plumbing, ventilation clearance, furnished by]
    check: >
      Every equipment item the equipment list places in or under casework has
      an opening on the elevations and the matching power and data on the
      electrical drawings, and every equipment opening on the elevations has
      an item on the list.
    severity: high
    owner: design_team
    gate: procurement_release

failure_modes:
  - id: 12hc.fm.equipment-late
    what_happens: Medication dispensing cabinets or monitored refrigerators selected after the casework was built
    consequence: Openings recut and power or data added at turnover, with the unit's activation delayed
    caught_by: [12hc.equipment-integration, 12hc.rc.equipment-list, if.11-medical-equipment-casework]
    source: field_experience

  - id: 12hc.fm.rail-backing-partial
    what_happens: Backing for a rail-hung system installed only behind the cabinets on the elevations
    consequence: The reconfigurable system can't be reconfigured; walls opened when the owner moves components
    caught_by: [12hc.wall-rail-systems]
    source: industry_practice
