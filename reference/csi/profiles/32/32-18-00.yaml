schema_version: 1
kind: section
id: "32 18 00"
title: Athletic and Recreational Surfacing
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: sometimes   # synthetic turf and track systems are often specified by performance

scope_summary: >
  Synthetic turf, running tracks, court surfaces and playground safety
  surfacing. The surface is a system with its own base, drainage and
  planarity requirements, so the surfacing manufacturer's acceptance of the
  base matters more than the product data. Playground surfacing is a safety
  and accessibility product: its impact attenuation must cover the fall
  height of the actual equipment across the whole use zone, the route to
  accessible play components must be tested for accessibility, and both
  degrade as loose fill is displaced.

submittals:
  - id: ath.sub.product-data
    type: Product Data
    must_show:
      - Surface system with the test data the spec requires (impact attenuation, accessibility, shock absorption, infill)
      - Base and drainage section the surfacing manufacturer requires, and its planarity tolerance
  - id: ath.sub.shop-drawings
    type: Shop Drawings
    must_show:
      - Layout, lines and markings to the governing body's dimensions for the level of play, seams and edge anchorage
  - id: ath.sub.warranty
    type: Warranty
    must_show:
      - Warranty terms and the maintenance the warranty depends on

review_checks:
  - id: ath.base-acceptance
    kind: completeness
    check: >
      The surfacing installer or manufacturer accepts the base (planarity,
      compaction, drainage) in writing before installation, and the base
      contractor, often the sitework subcontractor, was given that
      tolerance before building it.
    trace_to: [spec.part3, drawings.details]
    severity: high
    owner: gc
    gate: site_paving

  - id: ath.fall-height
    kind: conformance
    check: >
      Playground surfacing is tested for impact attenuation at a height at
      least equal to the fall height of each piece of equipment, and covers
      the full use zone around it; loose-fill depth is set for the settled,
      not the installed, condition.
    trace_to: [drawings.site, drawings.landscape, spec.part2]
    severity: critical
    owner: subcontractor

  - id: ath.accessible-surface
    kind: conformance
    check: >
      The route into the play area and to accessible play components is a
      surface tested for accessibility, unitary or loose fill with the
      maintenance it needs to stay accessible.
    trace_to: [spec.part2, drawings.site]
    severity: high
    owner: design_team

  - id: ath.field-tests
    kind: completeness
    check: >
      Field tests the spec or owner requires after installation (impact
      attenuation of turf fields, playground surface tests, planarity) are
      scheduled before acceptance and repeated at the intervals the warranty
      or owner requires.
    trace_to: [spec.part3]
    severity: medium
    owner: gc

  - id: ath.lines
    kind: conformance
    check: >
      Lines, markings and field or court dimensions follow the governing
      body for the level of play the owner names, including multi-sport
      lines and their colors.
    trace_to: [drawings.site, spec.part2]
    severity: medium
    owner: design_team

failure_modes:
  - id: ath.fm.base-out-of-tolerance
    what_happens: Base built without the surfacing manufacturer's planarity tolerance, and surfacing installed over it
    consequence: Ponding and failed planarity tests; warranty exclusion
    caught_by: [ath.base-acceptance]
    source: industry_practice

  - id: ath.fm.fall-height-short
    what_happens: Surfacing rated for a lower fall height than the equipment, or short of the use zone
    consequence: Injury exposure and replacement of the surfacing
    caught_by: [ath.fall-height]
    source: industry_practice

  - id: ath.fm.loose-fill-route
    what_happens: Loose fill used on the accessible route with no maintenance plan or unitary path
    consequence: Play area becomes inaccessible within months; complaints and retrofit
    caught_by: [ath.accessible-surface]
    source: industry_practice

  - id: ath.fm.wrong-lines
    what_happens: Lines laid out for a different level of play than the owner uses
    consequence: Restriping, or re-tufting inlaid turf lines
    caught_by: [ath.lines]
    source: industry_practice

standards:
  - id: ath.std.astm-f1292
    name: ASTM F1292
    title: Impact Attenuation of Surfacing Materials Within the Use Zone of Playground Equipment
    verify: Critical fall height rating of the playground surfacing
  - id: ath.std.astm-f1951
    name: ASTM F1951
    title: Determination of Accessibility of Surface Systems Under and Around Playground Equipment
    verify: Accessibility test of the playground surface
  - id: ath.std.astm-f1936
    name: ASTM F1936
    title: Impact Attenuation of Turf Playing Systems as Measured in the Field
    verify: Field impact attenuation testing of turf fields where specified

regulatory_hooks:
  - id: ath.rh.playground
    topic: playground-surfacing-accessibility
    question: >
      Which playground safety and accessibility requirements apply here
      (the adopted accessibility standard for play areas, state rules for
      schools or child care, the owner's insurer), and which surfacing
      standards do they cite?
    applies_when: Playgrounds and play areas
    source_families: [accessibility, building_code]
    severity: high

extract_fields:
  - id: ath.xf.fall-height
    label: Critical fall height rating of the surfacing, and the highest equipment fall height it serves
    type: string
    per: package
    reconcile_against: [spec.part2, drawings.site]
