schema_version: 1
kind: section
id: "32 90 00"
title: Planting
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: never

scope_summary: >
  Planting soil, turf and grasses, trees, shrubs and groundcovers, and
  their establishment; the type sections inherit from here. Plants are
  living material bought months ahead and installed at the end of the job,
  so availability substitutions, planting seasons and the start of the
  warranty and maintenance periods drive most disputes. Planting soil and
  drainage decide survival more than plant quality, and the replacement
  warranty only works if someone owns watering and care between
  installation and acceptance.

submittals:
  - id: pl.sub.soil
    type: Test Reports
    must_show:
      - Laboratory analysis of each planting soil (stockpiled, imported or blended) against the spec, with the amendments the results call for
  - id: pl.sub.product-data
    type: Product Data
    must_show:
      - Seed mixes and sod with species and source, mulch, and fertilizers
  - id: pl.sub.plant-material
    type: Samples
    must_show:
      - Nursery sources, and photos or tagging of specimen trees where the spec requires selection
      - Any plant not available as specified, with the proposed substitute's species, size and root ball or container class
  - id: pl.sub.schedule
    type: Schedule
    must_show:
      - Planting dates against the specified seasons, and when maintenance and warranty periods start

review_checks:
  - id: pl.sizes-and-substitutions
    kind: conformance
    check: >
      Species, sizes and root ball or container class match the plant
      schedule and the nursery stock standard; substitutions for
      availability are accepted by the landscape architect and checked
      against the landscape quantities and sizes the site plan approval
      requires.
    trace_to: [drawings.landscape, register.substitutions, drawings.site]
    severity: high
    owner: subcontractor

  - id: pl.soil-and-drainage
    kind: completeness
    check: >
      Planting soil is tested before placement and amended to the results,
      subgrade under beds compacted by construction traffic is loosened
      before soil goes in, and tree pits in compacted or clay subgrade are
      percolation-tested or drained as detailed.
    trace_to: [spec.part2, spec.part3, drawings.details]
    severity: high
    owner: subcontractor

  - id: pl.season
    kind: constructability
    check: >
      Planting and seeding dates fall within the spec's planting seasons;
      planting outside them has the landscape architect's acceptance and an
      agreed change to the warranty or maintenance terms.
    trace_to: [spec.part3, schedule.master]
    severity: medium
    owner: gc

  - id: pl.warranty-start
    kind: completeness
    check: >
      The contract says when the maintenance and warranty periods start (on
      acceptance of planting, substantial completion or the end of
      maintenance), who waters and maintains until then, how many
      replacements are owed and in which season, and how partial acceptance
      by area is documented.
    trace_to: [spec.part1, spec.part3]
    severity: high
    owner: gc

reconciliations:
  - id: pl.rc.trees-vs-utilities
    between: [drawings.landscape, drawings.civil, drawings.electrical]
    key: Each new tree
    fields: [location, clearance to utility lines and structures, clearance to light poles and signs, sight triangles at drives]
    check: >
      New trees are clear of utility lines, light poles, signs and sight
      triangles at drives, with root barriers where the details call for
      them; trees planted over utilities or in front of light fixtures are
      raised before planting.
    severity: medium
    owner: design_team

failure_modes:
  - id: pl.fm.bathtub-pits
    what_happens: Trees planted in pits dug into compacted clay, which hold water
    consequence: Trees drown within a season; replacement argued under the warranty
    caught_by: [pl.soil-and-drainage]
    source: industry_practice

  - id: pl.fm.untested-soil
    what_happens: Stockpiled topsoil placed untested, turning out to be subsoil with debris
    consequence: Poor establishment; amendments or replacement of the soil after planting
    caught_by: [pl.soil-and-drainage, if.31-clearing-planting]
    source: industry_practice

  - id: pl.fm.substitution-vs-approval
    what_happens: Smaller trees or different species substituted for availability
    consequence: Fails the site plan landscape inspection; replacement before occupancy
    caught_by: [pl.sizes-and-substitutions, d32.site-plan-approval]
    source: industry_practice

  - id: pl.fm.warranty-dispute
    what_happens: Plants installed early, then lost before acceptance with no one assigned to water them
    consequence: Dispute over who pays for replacements, and a delayed closeout
    caught_by: [pl.warranty-start]
    source: industry_practice

  - id: pl.fm.out-of-season
    what_happens: Planting forced into summer heat or frozen ground to meet completion
    consequence: Plant loss and replanting in the next season, holding closeout open
    caught_by: [pl.season]
    source: industry_practice

  - id: pl.fm.tree-conflicts
    what_happens: Trees planted over utility lines, in front of site lights or in drive sight triangles
    consequence: Root intrusion, relocation, dark parking areas or safety complaints
    caught_by: [pl.rc.trees-vs-utilities]
    source: industry_practice

standards:
  - id: pl.std.ansi-z60
    name: ANSI Z60.1 / ANSI Z60.2
    title: American Standard for Nursery Stock
    verify: Size, root ball and container class of the plant material submitted
    note: The 2025 edition is designated ANSI Z60.2; most specs still cite ANSI Z60.1

extract_fields:
  - id: pl.xf.substitutions
    label: Plant substitutions proposed (species, size, root ball or container class)
    type: list
    per: package
    reconcile_against: [drawings.landscape]
