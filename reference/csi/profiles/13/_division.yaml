schema_version: 1
kind: division
id: "13"
title: Special Construction
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

scope_summary: >
  Special construction varies by project: metal building systems, pools,
  shielded rooms, cold and clean rooms, isolated construction. Each scope is
  designed partly by a specialist outside the usual design team (the
  manufacturer's engineer, a medical physicist, an aquatic or refrigeration
  designer, an acoustician), each needs things from the base building that
  ordinary trades don't anticipate, and several need approval from an agency
  other than the building department and an acceptance test before use. The
  review question is whether the specialist's inputs and outputs are on the
  drawings of the trades that must build them before those trades pass the
  point of no return.

review_checks:
  - id: d13.specialist-documents
    kind: absence
    reflex: true
    check: >
      The specialty design this scope depends on (shielding report,
      manufacturer's structural design, pool or refrigeration design,
      cleanroom criteria, acoustical criteria) is identified, its author
      named, and it is either in the contract documents or required as a
      submittal. Consultant drawings that sheets reference but the set does
      not include are a finding.
    trace_to: [spec.part1, spec.division_01, drawings.plans]
    severity: high
    owner: design_team
    gate: procurement_release

  - id: d13.agency-approvals
    kind: completeness
    check: >
      Approvals this scope needs from agencies other than the building
      department (health department for public pools, the radiation control
      program for shielded rooms, the pharmacy board for compounding suites)
      are listed with who applies, what they review, and whether approval must
      precede construction.
    trace_to: [spec.part1, spec.division_01]
    severity: high
    owner: gc
    gate: procurement_release

  - id: d13.acceptance-sequence
    kind: completeness
    check: >
      The specialty acceptance steps (physicist's survey, cleanroom
      certification, cold room pull-down, pool inspection and start-up,
      acoustician's inspection) are scheduled with who performs them, after the
      base-building work they depend on (permanent power, balancing, final
      cleaning) and before the owner needs the space.
    trace_to: [spec.part3, schedule.master]
    severity: high
    owner: gc
    gate: substantial_completion

failure_modes:
  - id: d13.fm.consultant-set-missing
    what_happens: The specialty consultant's drawings are referenced but never issued, or arrive after the base building design is fixed
    consequence: The base building lacks the recesses, loads, penetrations or MEP the specialty needs; redesign during construction
    caught_by: [d13.specialist-documents]
    source: industry_practice

  - id: d13.fm.agency-late
    what_happens: An agency approval that must precede construction is discovered after work has started
    consequence: Work stopped or reworked to the agency's comments
    caught_by: [d13.agency-approvals]
    source: industry_practice

  - id: d13.fm.acceptance-unscheduled
    what_happens: The specialty acceptance test or agency inspection is left off the schedule
    consequence: Occupancy or first use delayed while the test is arranged and failures corrected
    caught_by: [d13.acceptance-sequence]
    source: industry_practice
