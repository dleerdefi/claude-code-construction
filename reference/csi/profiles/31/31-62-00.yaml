schema_version: 1
kind: section
id: "31 62 00"
title: Driven Piles
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: never

scope_summary: >
  Steel H-piles, pipe piles, and precast concrete and timber piles driven
  to a resistance or tip elevation. Driving criteria come from a wave
  equation analysis of the submitted hammer, cushion and pile, confirmed by
  dynamic testing, so a hammer change voids them. The field problems are
  piles that run long or stop high, damage from hard driving, heave of
  piles already driven, and vibration felt by neighbors.

submittals:
  - id: drv.sub.driving-system
    type: Product Data
    must_show:
      - Hammer make and model with rated energy, helmet and cushion
      - Wave equation analysis of that system on the specified pile and soils, with driving stresses
  - id: drv.sub.shop-drawings
    type: Shop Drawings
    must_show:
      - Splice and tip protection details, and order lengths with their basis

review_checks:
  - id: drv.wave-equation
    kind: conformance
    check: >
      Driving criteria and driving stresses come from a wave equation
      analysis of the exact hammer, cushion and pile submitted; a different
      or modified hammer gets a new analysis before it drives a production
      pile.
    trace_to: [spec.part3, report.geotechnical]
    severity: high
    owner: subcontractor
    gate: procurement_release

  - id: drv.restrike
    kind: completeness
    check: >
      Where the report expects set-up or relaxation, restrike testing after
      the waiting period it names is in the program, and capacity is not
      accepted on initial drive alone.
    trace_to: [report.geotechnical, spec.part3]
    severity: medium
    owner: design_team

  - id: drv.order-lengths
    kind: constructability
    check: >
      Order lengths come from the test pile results and the variability in
      the borings, splice details are approved before piles run long, and
      the disposition of piles that stop high is defined.
    trace_to: [report.geotechnical, spec.part3]
    severity: medium
    owner: gc

  - id: drv.refusal-damage
    kind: conformance
    check: >
      Practical refusal and the maximum blow count are defined so piles are
      not driven past damaging stresses; piles that drift, bend, or show
      head or tip damage are reported, not cut off and accepted.
    trace_to: [spec.part3]
    severity: high
    owner: subcontractor

  - id: drv.heave-and-predrilling
    kind: constructability
    check: >
      Previously driven piles are checked for heave as neighbors are driven
      and redriven as the spec requires, and predrilling, jetting or
      spudding are used only where and as deep as the spec allows, since
      they reduce capacity.
    trace_to: [spec.part3, report.geotechnical]
    severity: medium
    owner: subcontractor

failure_modes:
  - id: drv.fm.hammer-swap
    what_happens: A different or modified hammer arrives on site after the analysis was approved
    consequence: Piles accepted on criteria that do not apply to the hammer used
    caught_by: [drv.wave-equation]
    source: industry_practice

  - id: drv.fm.no-restrike
    what_happens: Capacity accepted at initial drive in soils that gain or lose capacity with time
    consequence: Capacity misjudged; extra piles or unsafe acceptance
    caught_by: [drv.restrike]
    source: industry_practice

  - id: drv.fm.overdriven
    what_happens: Piles driven past refusal with damage below grade that nobody sees
    consequence: Damaged elements under the cap; integrity questions after the pour
    caught_by: [drv.refusal-damage]
    source: industry_practice

  - id: drv.fm.heave-ignored
    what_happens: Piles lifted by adjacent driving and never redriven
    consequence: Lost end bearing and settlement under load
    caught_by: [drv.heave-and-predrilling]
    source: industry_practice

  - id: drv.fm.short-order
    what_happens: Piles run long and no splice detail or material is approved
    consequence: Production stops while splices are designed and material is bought
    caught_by: [drv.order-lengths]
    source: industry_practice

extract_fields:
  - id: drv.xf.hammer
    label: Hammer, rated energy and cushion submitted
    type: string
    per: package
    reconcile_against: [spec.part3]
