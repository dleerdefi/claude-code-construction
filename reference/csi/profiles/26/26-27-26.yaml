schema_version: 1
kind: section
id: "26 27 26"
title: Wiring Devices
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: never

# Wiring devices sit under 26 20 00 by number but carry none of the
# distribution-equipment questions (fault ratings, study, footprint, utility,
# neutral bonding). 26ds.equipment-connections stays: a cord-connected item
# needs its receptacle.
suppress:
  - {id: 26ds.sub.shop-drawings, reason: "Switchboard and panelboard shop drawing content; not part of a wiring device submittal"}
  - {id: 26ds.sub.product-data, reason: "Transformer and overcurrent device product data; not part of a wiring device submittal"}
  - {id: 26ds.sub.design-data, reason: "Seismic data for floor-standing distribution equipment"}
  - {id: 26ds.sub.utility-approval, reason: "Utility acceptance applies to service equipment"}
  - {id: 26ds.disconnect-furnish, reason: "Disconnects, starters and drives are reviewed with distribution equipment and controllers"}
  - {id: 26ds.sccr-vs-fault, reason: "Receptacles and switches carry no short-circuit or interrupting rating to compare"}
  - {id: 26ds.study-before-release, reason: "The study gates distribution equipment, not wiring devices"}
  - {id: 26ds.utility-requirements, reason: "Applies to service equipment"}
  - {id: 26ds.fits-room-and-path, reason: "Applies to floor-standing distribution equipment"}
  - {id: 26ds.dedicated-space, reason: "Applies to switchboards and panelboards"}
  - {id: 26ds.stub-ups, reason: "Applies to floor-standing distribution equipment"}
  - {id: 26ds.grounding-neutral, reason: "Applies to services, separately derived systems and panelboards"}
  - {id: 26ds.transformers, reason: "Applies to transformers"}
  - {id: 26ds.gfp-testing, reason: "Ground-fault protection of equipment is set on service and feeder devices, not wiring devices"}
  - {id: 26ds.rc.equipment-nameplate, reason: "Panel-level reconciliation; the receptacle-to-plug match is 26wd.plug-configurations"}
  - {id: 26ds.rc.single-line, reason: "Applies to switchboards, panelboards and transformers"}
  - {id: 26ds.fm.substitution-not-carried, reason: "Caught at panel level by a reconciliation suppressed here"}
  - {id: 26ds.fm.double-furnished, reason: "Disconnect and drive scope; suppressed with its check"}
  - {id: 26ds.fm.fault-rises, reason: "Fault rating; suppressed with its check"}
  - {id: 26ds.fm.released-before-study, reason: "Study timing; suppressed with its check"}
  - {id: 26ds.fm.utility-rejects, reason: "Service equipment; suppressed with its check"}
  - {id: 26ds.fm.no-path-in, reason: "Floor-standing equipment; suppressed with its check"}
  - {id: 26ds.fm.pipe-over-gear, reason: "Dedicated space; suppressed with its check"}
  - {id: 26ds.fm.stubs-misaligned, reason: "Floor-standing equipment; suppressed with its check"}
  - {id: 26ds.fm.downstream-bond, reason: "Neutral bonding; suppressed with its check"}
  - {id: 26ds.std.neta-ats, reason: "Acceptance testing of distribution equipment"}
  - {id: 26ds.rh.working-space, reason: "Working space applies to equipment serviced while energized"}
  - {id: 26ds.rh.selective-coordination, reason: "Answered by the study and distribution equipment reviews"}
  - {id: 26ds.rh.ground-fault, reason: "Ground-fault protection of equipment, not GFCI (26wd.rh.receptacle-protection covers GFCI)"}
  - {id: 26ds.rh.equipment-marking, reason: "Marking applies to service and distribution equipment"}
  - {id: 26ds.rh.utility, reason: "Applies to service equipment"}
  - {id: 26ds.rh.arc-energy-reduction, reason: "Applies to large circuit breakers and fuses"}
  - {id: 26ds.xf.available-fault, reason: "No fault rating to reconcile on wiring devices"}
  - {id: 26ds.xf.footprint, reason: "Applies to floor-standing distribution equipment"}

scope_summary: >
  Receptacles, switches, dimmers, floor boxes and their plates. The product
  data is easy; the decisions are on the drawings: which device goes where,
  at what height, with what protection. The misses are protection the code
  requires that the drawings don't show (GFCI, AFCI, tamper- and
  weather-resistant), GFCI resets hidden behind equipment, heights that clash
  with casework, backsplashes and accessible reach, controlled receptacles
  the energy code needs, and floor boxes that had to be cast in.

submittals:
  - id: 26wd.sub.product-data
    type: Product Data
    must_show:
      - Each device type with grade, configuration, color and plate material and finish
      - GFCI, AFCI, tamper-resistant, weather-resistant, isolated-ground and hospital-grade devices marked where used
      - Controlled-receptacle marking where the energy code requires it
      - Floor boxes and poke-throughs with their fire rating and floor-finish compatibility

review_checks:
  - id: 26wd.device-ratings
    kind: conformance
    check: >
      Device grade, configuration, color and plate finish match the spec and
      finish selections, with tamper-resistant, weather-resistant,
      hospital-grade and isolated-ground devices wherever the drawings, spec
      or code call for them.
    trace_to: [spec.part2, drawings.electrical, schedule.finish]
    severity: medium
    owner: subcontractor

  - id: 26wd.protection-locations
    kind: absence
    check: >
      Every location where the adopted code requires GFCI or AFCI protection
      is protected by a device or a breaker shown on the drawings or panel
      schedules, and the method is chosen so the reset stays readily
      accessible (not behind refrigerators, vending machines or inside sink
      cabinets).
    trace_to: [drawings.electrical, schedule.electrical_panel]
    severity: high
    owner: design_team

  - id: 26wd.heights-vs-layouts
    kind: coordination
    check: >
      Device heights and locations agree with casework elevations,
      backsplashes, countertop appliances, furniture and equipment layouts,
      and with accessible reach ranges where the device is for occupant use.
    trace_to: [drawings.interior_elevations, drawings.electrical, schedule.casework]
    severity: high
    owner: gc
    gate: in_wall_rough_in

  - id: 26wd.controlled-receptacles
    kind: conformance
    check: >
      Receptacles the energy compliance documents require to be
      automatically controlled are marked as the code requires and wired to
      their control zone.
    trace_to: [report.energy_compliance, drawings.electrical]
    severity: medium
    owner: subcontractor

  - id: 26wd.plug-configurations
    kind: coordination
    check: >
      Special-purpose receptacles (voltage, ampere rating, locking or
      straight-blade configuration) match the cord caps of the equipment that
      plugs into them, taken from the approved equipment submittals and the
      owner's equipment list rather than the design-stage schedule; owner
      equipment still unselected is listed as an open item before rough-in.
    trace_to: [schedule.equipment, schedule.foodservice_equipment, drawings.electrical, submittals.approved]
    severity: medium
    owner: gc
    gate: in_wall_rough_in

  - id: 26wd.floor-boxes
    kind: constructability
    check: >
      Floor boxes and poke-throughs match the furniture and AV layouts, are
      listed for the fire rating of the floor they penetrate and compatible
      with its finish, and cast-in boxes and their raceway are set before
      the pour.
    trace_to: [drawings.electrical, drawings.technology, drawings.plans]
    severity: high
    owner: gc
    gate: slab_pour

failure_modes:
  - id: 26wd.fm.protection-missed
    what_happens: Code-required GFCI or AFCI protection not shown on the drawings or panel schedules, found at inspection
    consequence: Breakers or devices replaced after trim-out; re-inspection
    caught_by: [26wd.protection-locations]
    source: industry_practice

  - id: 26wd.fm.hidden-reset
    what_happens: GFCI receptacle installed behind a refrigerator or vending machine, or inside a sink base cabinet
    consequence: Reset not readily accessible; device relocated or protection moved to the breaker
    caught_by: [26wd.protection-locations]
    source: industry_practice

  - id: 26wd.fm.backsplash-split
    what_happens: Boxes set at plan heights before casework shop drawings; a box is split by the backsplash or hidden behind an upper cabinet
    consequence: Boxes relocated after drywall; patch and paint
    caught_by: [26wd.heights-vs-layouts, if.casework-electrical]
    source: industry_practice

  - id: 26wd.fm.not-tamper-resistant
    what_happens: Standard receptacles installed in a space type where the code requires tamper-resistant devices
    consequence: Devices replaced before final inspection
    caught_by: [26wd.device-ratings]
    source: industry_practice

  - id: 26wd.fm.plug-mismatch
    what_happens: Receptacles installed to the design-stage schedule; the approved or owner-furnished equipment arrives with a different plug, voltage or ampere rating
    consequence: Receptacles swapped at move-in, and circuits or boxes changed where the rating differs
    caught_by: [26wd.plug-configurations]
    source: industry_practice

  - id: 26wd.fm.floor-box-missed
    what_happens: Cast-in floor boxes for conference tables or open office missed at the slab pour
    consequence: Coring and trenching after the slab, or poke-throughs that don't match the furniture
    caught_by: [26wd.floor-boxes, if.26-av-floor-boxes]
    source: industry_practice

regulatory_hooks:
  - id: 26wd.rh.receptacle-protection
    topic: receptacle-protection-and-type-requirements
    question: >
      Which locations and occupancies require GFCI protection, AFCI
      protection, tamper-resistant receptacles and weather-resistant
      receptacles under the adopted electrical code and its local amendments?
    applies_when: Every project with receptacles
    source_families: [electrical_code]
    severity: high

  - id: 26wd.rh.reach-ranges
    topic: accessibility-reach-ranges
    question: >
      Do switches, receptacles and other controls intended for occupant use
      fall within the reach ranges of the adopted accessibility standard
      (including over counters and obstructions), and which devices are
      exempt?
    applies_when: Devices and controls in spaces with accessible routes
    source_families: [accessibility]
    severity: medium

extract_fields:
  - id: 26wd.xf.devices
    label: Device types with grade, protection and finish
    type: list
    per: package
    reconcile_against: [spec.part2, drawings.electrical]
