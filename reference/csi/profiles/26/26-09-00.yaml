schema_version: 1
kind: section
id: "26 09 00"
title: Instrumentation and Control for Electrical Systems
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: sometimes   # networked lighting control layouts and programming are often by the manufacturer

scope_summary: >
  Mostly lighting controls (26 09 23 devices, 26 09 43 networked systems,
  dimming and relay panels), which inherit from here; power monitoring and
  contactors share the number but rarely the risk. Controls are where energy
  code compliance, the luminaires' drivers and commissioning meet. The misses
  are drivers and controls that speak different protocols, sequences nobody
  wrote down, emergency luminaires the control system can leave off, and
  functional testing the energy code requires that nobody scheduled.

submittals:
  - id: 26lc.sub.shop-drawings
    type: Shop Drawings
    must_show:
      - Riser and network diagram with every panel, gateway and zone
      - Device layout by room keyed to the lighting plans, with sensor coverage patterns
      - Sequence of operation per space type, with overrides and schedules
      - Emergency transfer or bypass devices and the luminaires they serve
  - id: 26lc.sub.product-data
    type: Product Data
    must_show:
      - Sensors, switches, relays and dimmers with their control protocol
      - The control manufacturer's compatibility statement for the submitted drivers
  - id: 26lc.sub.test-reports
    type: Test Reports
    must_show:
      - Functional testing documentation in the form the energy code and commissioning plan require

review_checks:
  - id: 26lc.driver-compatibility
    kind: conformance
    check: >
      The control manufacturer's compatibility statement covers the exact
      driver models in the luminaire submittal, for dimming range, low-end
      stability and minimum load, rather than the protocol name alone.
    trace_to: [schedule.lighting_fixture, spec.part2]
    severity: high
    owner: subcontractor
    gate: procurement_release

  - id: 26lc.sequences
    kind: absence
    check: >
      A sequence of operation exists for each space type (occupancy or
      vacancy, daylight zones, scheduled shutoff, overrides, plug-load
      control) and agrees with the energy compliance documents and the
      owner's operating hours.
    trace_to: [report.energy_compliance, drawings.electrical, spec.part2]
    severity: high
    owner: design_team

  - id: 26lc.sensor-coverage
    kind: conformance
    check: >
      Sensor types and locations cover each room's geometry and use
      (partitions, tall shelving, restroom stalls, open office), and daylight
      sensors sit in the zones the daylighting plan defines.
    trace_to: [drawings.electrical, drawings.rcp]
    severity: medium
    owner: subcontractor

  - id: 26lc.emergency-override
    kind: conformance
    check: >
      Emergency luminaires on controlled circuits go to full output on loss
      of normal power through a listed emergency transfer or bypass device,
      so the controls cannot leave egress lighting off when power fails.
    trace_to: [drawings.electrical, schedule.lighting_fixture]
    severity: high
    owner: subcontractor

  - id: 26lc.functional-testing
    kind: completeness
    check: >
      Controls functional testing that the energy code or commissioning plan
      requires is scheduled after programming and before occupancy, naming
      who programs, who tests and who witnesses.
    trace_to: [report.commissioning, report.energy_compliance, spec.part3]
    severity: high
    owner: gc
    gate: substantial_completion

  - id: 26lc.network-integration
    kind: coordination
    check: >
      Where lighting controls connect to the building automation system or
      the owner's network, the protocol, ports, addressing and the party who
      integrates are assigned.
    trace_to: [spec.part2, drawings.technology]
    severity: medium
    owner: gc

failure_modes:
  - id: 26lc.fm.driver-incompatible
    what_happens: A luminaire substitution brings drivers the controls cannot dim smoothly, or the controls are substituted and the specified drivers no longer match
    consequence: Flicker, drop-out or no dimming at turnover; drivers replaced in installed luminaires
    caught_by: [26lc.driver-compatibility, if.26-lighting-controls-luminaires]
    source: industry_practice

  - id: 26lc.fm.no-sequence
    what_happens: Controls installed with no written sequence; the programmer guesses at turnover
    consequence: Lights on all night or off on occupants; the energy code functional test fails
    caught_by: [26lc.sequences, 26lc.functional-testing]
    source: industry_practice

  - id: 26lc.fm.egress-left-off
    what_happens: Normally switched emergency luminaires wired without a listed transfer device
    consequence: Egress lighting can stay off when normal power fails; failed life-safety inspection
    caught_by: [26lc.emergency-override]
    source: industry_practice

regulatory_hooks:
  - id: 26lc.rh.energy-controls
    topic: energy-code-lighting-controls
    question: >
      Which lighting and receptacle controls does the adopted energy code
      require for each space type (occupancy or vacancy sensing,
      daylight-responsive control, automatic shutoff, light reduction,
      plug-load control), and what functional testing must be documented?
    applies_when: New lighting and controls, and lighting alterations above the energy code's threshold
    source_families: [energy]
    severity: high

extract_fields:
  - id: 26lc.xf.protocol
    label: Control protocol and control wiring type
    type: string
    per: package
    reconcile_against: [schedule.lighting_fixture]
