# Deliberately thin. Everything under 26 05 inherits this file, and the family
# is mixed: conductors, raceway, grounding and underground ducts sit beside
# identification, seismic controls and power system studies. Their knowledge
# lives in 26 05 19, 26 05 26, 26 05 33, 26 05 43 and 26 05 73 so that a study
# or an identification review does not inherit raceway and grounding checks.
equivalents: ["26 05 19", "26 05 26", "26 05 33", "26 05 43"]

scope_summary: >
  The 26 05 family: conductors (26 05 19), grounding (26 05 26), raceway and
  boxes (26 05 33), underground ducts (26 05 43), supports, sleeves,
  identification, seismic controls and power system studies (26 05 73). As a
  section of its own, 26 05 00 usually carries general installation
  requirements, sleeves and sleeve seals. Where a project specifies
  conductors, raceway, grounding or underground ducts inside 26 05 00
  instead of under their own numbers, resolve 26 05 19, 26 05 33, 26 05 26 and
  26 05 43 for those parts of the submittal.
