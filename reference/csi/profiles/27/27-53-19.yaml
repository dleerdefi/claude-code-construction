schema_version: 1
kind: section
id: "27 53 19"
title: Internal Cellular, Paging, and Antenna Systems
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

equivalents: ["28 05 37"]   # emergency responder radio systems are also specified under Division 28

contractor_designed: typical

scope_summary: >
  In-building distributed antenna systems for cellular coverage and, more
  critically, emergency responder radio coverage. Whether the building
  needs coverage enhancement is usually not known until a signal survey of
  the enclosed building, which makes it the classic late surprise:
  amplifiers, a donor antenna, survivable cabling, rated enclosures and fire
  alarm monitoring appear after ceilings close. The AHJ and the radio
  system's licensee both have to accept it.

submittals:
  - id: 27rc.sub.design-data
    type: Design Data
    must_show:
      - Signal survey or predictive model of the building as built, by floor
      - Coverage design with predicted signal levels in critical and general areas
      - Equipment, antenna and donor antenna layout, and battery calculations
  - id: 27rc.sub.product-data
    type: Product Data
    must_show:
      - Signal boosters and system components with their listing, enclosure ratings and supervisory outputs
  - id: 27rc.sub.certificates
    type: Certificates
    must_show:
      - The radio licensee's written consent to retransmit and the frequencies to amplify
      - Designer and installer qualifications the AHJ requires

review_checks:
  - id: 27rc.need-determined
    kind: absence
    reflex: true
    check: >
      Whether emergency responder radio coverage is required is settled
      early: the AHJ's requirement, a predictive study or a survey of the
      enclosed building, and a budget and design path if amplification is
      needed. Silence in the documents is not a no.
    trace_to: [spec.part1, drawings.technology, drawings.life_safety]
    severity: critical
    owner: design_team
    gate: procurement_release

  - id: 27rc.survivability
    kind: conformance
    check: >
      Backbone cable, amplifiers and power supplies are in the survivable
      pathways and the rated enclosures the code requires.
    trace_to: [spec.part2, drawings.technology]
    severity: high
    owner: subcontractor

  - id: 27rc.monitoring
    kind: coordination
    check: >
      The supervisory signals the code requires (amplifier, antenna, power
      and battery) are on the fire alarm drawings with their monitoring
      points, or on the dedicated annunciator the AHJ accepts.
    trace_to: [drawings.fire_alarm]
    severity: high
    owner: gc

  - id: 27rc.donor-antenna
    kind: coordination
    check: >
      The donor antenna location, mount and roof penetration, with its cable
      route to the headend, are coordinated with roofing and lightning
      protection.
    trace_to: [drawings.roof_plan, drawings.technology]
    severity: medium
    owner: gc
    gate: roof_membrane

  - id: 27rc.licensee-consent
    kind: completeness
    check: >
      The radio licensee's written consent to retransmit and its frequency
      list are obtained before amplifiers are ordered.
    trace_to: [spec.part1]
    severity: high
    owner: gc
    gate: procurement_release

  - id: 27rc.acceptance
    kind: completeness
    check: >
      Acceptance testing (test grid, signal levels and delivered audio
      quality in critical and general areas) follows the code and AHJ
      procedure, with the AHJ or radio authority witness scheduled.
    trace_to: [spec.part3]
    severity: high
    owner: gc
    gate: substantial_completion

failure_modes:
  - id: 27rc.fm.late-survey
    what_happens: Radio survey done after the building is finished; coverage fails
    consequence: Amplifiers, antennas and survivable cabling installed through finished ceilings; occupancy held
    caught_by: [27rc.need-determined]
    source: industry_practice

  - id: 27rc.fm.no-consent
    what_happens: Amplifier ordered and installed without the licensee's consent and frequency list
    consequence: System cannot be turned on; reprogramming or replacement
    caught_by: [27rc.licensee-consent]
    source: industry_practice

  - id: 27rc.fm.not-monitored
    what_happens: Signal boosters installed with no fire alarm monitoring points
    consequence: Failed acceptance; fire alarm modules and programming added late
    caught_by: [27rc.monitoring, if.27-errcs-fire-alarm-monitoring]
    source: industry_practice

  - id: 27rc.fm.no-circuit
    what_happens: No circuit on the source the code requires was designed for the amplifiers
    consequence: Circuits added from the emergency panel after ceilings close
    caught_by: [if.26-errcs-power]
    source: industry_practice

standards:
  - id: 27rc.std.nfpa-1225
    name: NFPA 1225
    title: Standard for Emergency Services Communications
    verify: In-building emergency responder communication enhancement requirements the adopted code references
    note: Earlier codes reference NFPA 1221 or NFPA 72 for these requirements; confirm which the adopted code cites
  - id: 27rc.std.ul-2524
    name: UL 2524
    title: In-building 2-Way Emergency Radio Communication Enhancement Systems
    verify: Listing of signal boosters and system components

regulatory_hooks:
  - id: 27rc.rh.coverage
    topic: emergency-responder-radio-coverage
    question: >
      Does the adopted fire code or a local ordinance require emergency
      responder radio coverage in this building, and at what signal strength
      and coverage in critical and general areas, with what pathway
      survivability, standby power duration, monitoring and acceptance
      testing?
    applies_when: Every new building, and additions or alterations the fire code covers
    source_families: [fire_code]
    severity: critical
