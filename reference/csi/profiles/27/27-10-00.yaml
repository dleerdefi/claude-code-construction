schema_version: 1
kind: section
id: "27 10 00"
title: Structured Cabling
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: sometimes

scope_summary: >
  Equipment room fittings, backbone and horizontal cabling, connectivity and
  testing (27 11 00 through 27 16 00 inherit from here). The owner usually
  wants a manufacturer's extended system warranty, which needs a certified
  installer, one manufacturer's matched components end to end, and test
  results in that manufacturer's format, so one substituted component can
  void it. Cable is pulled late and tested at the end, which is when outlet
  counts that don't match furniture and other systems' needs, and runs too
  long for the standard, surface.

submittals:
  - id: 27sc.sub.product-data
    type: Product Data
    must_show:
      - Cable, jacks, patch panels, faceplates, fiber and connectors, all within one manufacturer's warranty system
      - Racks, cabinets, cable management and ladder rack
  - id: 27sc.sub.shop-drawings
    type: Shop Drawings
    must_show:
      - Telecom room layouts and rack elevations
      - Backbone riser with fiber and copper counts
      - Labeling scheme and outlet schedule
  - id: 27sc.sub.qualifications
    type: Qualification Statements
    must_show:
      - Installer's current certification by the cabling manufacturer
  - id: 27sc.sub.test-reports
    type: Test Reports
    must_show:
      - Permanent link or channel results for every copper link and every fiber strand, as native tester files
  - id: 27sc.sub.warranty
    type: Warranty
    must_show:
      - Manufacturer's system warranty registration

review_checks:
  - id: 27sc.performance-class
    kind: conformance
    check: >
      Cable category or fiber type, connectors and patch panels meet the
      performance class the spec requires as a tested channel from one
      manufacturer's system, not as separately rated components.
    trace_to: [spec.part2]
    severity: high
    owner: subcontractor

  - id: 27sc.warranty-system
    kind: completeness
    check: >
      The installer's certification by the cabling manufacturer is current,
      every component is in that manufacturer's warranty system, and the
      documentation the warranty registration needs is known before cable is
      pulled.
    trace_to: [spec.part1, spec.part2]
    severity: high
    owner: subcontractor
    gate: procurement_release

  - id: 27sc.length-limits
    kind: constructability
    check: >
      No horizontal link exceeds the standard's length limit as actually
      routed through the pathway, not as straight-line distance; remote rooms
      that would exceed it are raised early for another telecom room, a
      consolidation point or fiber.
    trace_to: [drawings.technology, drawings.plans]
    severity: high
    owner: design_team
    gate: overhead_rough_in

  - id: 27sc.testing
    kind: completeness
    check: >
      Every link and strand is tested to the standard the spec cites with a
      tester of the required accuracy level, results are native tester files
      with pass margins (no edited or marginal passes), and failures are
      reterminated and retested.
    trace_to: [spec.part3]
    severity: high
    owner: subcontractor
    gate: substantial_completion

  - id: 27sc.labeling
    kind: conformance
    check: >
      Labels at outlets, patch panels, cables and racks follow the
      administration standard and the owner's scheme, and test results and
      record drawings use the same identifiers.
    trace_to: [spec.part3, drawings.technology]
    severity: medium
    owner: subcontractor

reconciliations:
  - id: 27sc.rc.outlets
    between: [drawings.technology, drawings.plans, drawings.security, drawings.mechanical]
    key: Room and outlet location
    fields: [outlet count by type, wireless access point locations, outlets at furniture, drops for other systems]
    check: >
      Outlet counts and locations on the technology plans match the
      furniture and equipment layouts and the wireless access point plan,
      including drops for other systems (cameras, access control panels,
      displays, building automation controllers) that their contractors
      expect the cabling contractor to provide.
    severity: medium
    owner: design_team
    gate: in_wall_rough_in

failure_modes:
  - id: 27sc.fm.mixed-components
    what_happens: Patch panels or jacks from a second manufacturer substituted into the channel
    consequence: Manufacturer declines the system warranty
    caught_by: [27sc.warranty-system, 27sc.performance-class]
    source: industry_practice

  - id: 27sc.fm.over-length
    what_happens: Horizontal runs to remote rooms exceed the standard's length limit once routed through the pathway
    consequence: Links fail certification; an added telecom room or fiber to the edge after ceilings close
    caught_by: [27sc.length-limits]
    source: industry_practice

  - id: 27sc.fm.marginal-tests
    what_happens: Results submitted as summaries with marginal passes, or from a tester below the required accuracy level
    consequence: Warranty registration refused; the building retested
    caught_by: [27sc.testing]
    source: industry_practice

  - id: 27sc.fm.other-system-drops
    what_happens: Drops for cameras, access panels and building automation assumed by each system's contractor to be in the cabling scope, and by the cabling contractor to be in theirs
    consequence: Missing drops found during system start-up, after ceilings close
    caught_by: [27sc.rc.outlets, if.27-security-network]
    source: industry_practice

standards:
  - id: 27sc.std.tia-568
    name: ANSI/TIA-568 series (568.0, 568.1, 568.2, 568.3)
    title: Generic, commercial building, balanced twisted-pair, and optical fiber cabling standards
    verify: Performance category, channel and permanent link test limits, and length limits
    note: Confirm the editions the spec cites
  - id: 27sc.std.tia-606
    name: ANSI/TIA-606
    title: Administration Standard for Telecommunications Infrastructure
    verify: Labeling scheme and record keeping
    note: Confirm the edition the spec cites

extract_fields:
  - id: 27sc.xf.category
    label: Copper performance category and fiber types
    type: string
    per: package
    reconcile_against: [spec.part2]
  - id: 27sc.xf.warranty
    label: Manufacturer warranty program and installer certification
    type: string
    per: package
    reconcile_against: [spec.part1]
