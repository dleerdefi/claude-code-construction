# Deliberately thin: the three families under this number share little but
# pathways and power. Paging, masking and intercom knowledge lives in
# 27 51 00, nurse call in 27 52 23 and radio coverage in 27 53 19, so a nurse
# call or radio coverage review does not inherit paging checks.

scope_summary: >
  Three families of distributed systems: audio-video communications such as
  paging, sound masking, intercom and emergency communication (27 51 00),
  healthcare communications such as nurse call (27 52 00), and distributed
  systems such as clocks and in-building antenna and radio coverage
  (27 53 00). Each carries its own profile; what they share is the pathway,
  power and monitoring they need from others, and a frequent overlap with
  life safety.
