schema_version: 1
kind: section
id: "10 26 00"
title: Wall and Door Protection
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: never

scope_summary: >
  Corner guards, bumper and crash rails, protective corridor handrails,
  impact-resistant wall covering, and door and frame protection. Rails run
  the length of corridors at the height where switches, thermostats, card
  readers and fire alarm devices also go, and they need continuous backing
  behind them. Plastic wall covering is interior finish with a fire
  classification, and protection applied to fire-rated doors has to stay
  within the door's listing.

submittals:
  - id: 10wp.sub.shop-drawings
    type: Shop Drawings
    must_show:
      - Plan of every run with type, height and extent, and terminations at door frames, inside corners and wall ends
      - Attachment and the backing each type needs
      - Door protection per door, keyed to the door schedule, with rated doors identified
  - id: 10wp.sub.product-data
    type: Product Data
    must_show:
      - Fire test classification of each plastic product as mounted
      - Listing or door manufacturer acceptance for protection on fire-rated doors

review_checks:
  - id: 10wp.continuous-backing
    kind: constructability
    check: >
      Rails and corridor handrails have continuous backing at their mounting
      height for the full length of each run, and full-height corner guards
      have fastening along their height. Run lengths and heights are taken
      from the wall protection plan, not pieced together from room elevations.
    trace_to: [drawings.plans, drawings.interior_elevations, drawings.details]
    severity: high
    owner: gc
    gate: wall_close_in

  - id: 10wp.rated-doors
    kind: conformance
    check: >
      Armor plates, edge guards and full door wraps on fire-rated doors are
      within what the door's listing allows (plate height, factory-applied
      labeled protection), and field-applied plastic protection on rated doors
      has the listing or the door manufacturer's acceptance.
    trace_to: [schedule.door, schedule.door_hardware, drawings.life_safety]
    severity: high
    owner: subcontractor
    gate: procurement_release

  - id: 10wp.finish-classification
    kind: conformance
    check: >
      Plastic wall covering, rail covers and corner guards carry the interior
      finish classification required for corridors, exits and rooms of this
      occupancy, as tested in the mounted configuration.
    trace_to: [spec.part2, drawings.life_safety]
    severity: medium
    owner: subcontractor

failure_modes:
  - id: 10wp.fm.devices-behind-rails
    what_happens: Switches, thermostats, card readers and fire alarm devices roughed in at crash-rail or handrail height along corridors
    consequence: Rails cut around devices, or devices relocated and walls patched after finishes
    caught_by: [if.10-wall-protection-devices]
    source: field_experience

  - id: 10wp.fm.rated-door-wrap
    what_happens: Field-applied plastic door wraps or oversized plates installed on fire-rated doors
    consequence: Fire marshal fails the doors; protection removed or doors replaced with labeled factory-protected doors
    caught_by: [10wp.rated-doors]
    source: industry_practice

  - id: 10wp.fm.rails-pull-off
    what_happens: Rails fastened to studs or board where continuous backing was never installed
    consequence: Rails loosen under cart impact; walls opened to add backing
    caught_by: [10wp.continuous-backing]
    source: industry_practice

standards:
  - id: 10wp.std.nfpa-80
    name: NFPA 80
    title: Standard for Fire Doors and Other Opening Protectives
    verify: Limits on protective plates and field modifications of fire-rated doors

regulatory_hooks:
  - id: 10wp.rh.wall-finish-class
    topic: interior-wall-finish-classification
    question: >
      What interior wall finish classification (flame spread class or
      room-corner test) does the adopted code require in corridors, exits and
      rooms of this occupancy, and do plastic wall protection products count as
      interior finish?
    applies_when: Plastic wall covering, rails or corner guards
    source_families: [building_code]
    severity: medium

  - id: 10wp.rh.rated-door-protection
    topic: fire-door-field-modifications
    question: >
      What does the adopted fire code and fire door standard allow for
      protective plates and field-applied coverings on fire-rated doors, and
      when must the protection be factory-applied under the label?
    applies_when: Door protection on fire-rated doors
    source_families: [fire_code, building_code]
    severity: high
