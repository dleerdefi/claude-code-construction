schema_version: 1
kind: section
id: "10 28 00"
title: Toilet, Bath, and Laundry Accessories
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: never

scope_summary: >
  Grab bars, dispensers, mirrors, waste receptacles, hand dryers, diaper
  changing stations, shower seats and the rest of the toilet room accessories.
  Accessibility inspectors measure these first: grab bar positions and
  clearances, dispenser outlets within reach, mirror and towel heights, and
  what sits above or below a grab bar. Quantities follow the fixtures, the
  owner's janitorial supplier often furnishes the dispensers, and dryers need
  circuits at the height the unit ends up at, so most problems are decided at
  rough-in rather than at installation.

review_mode: per_element
element_types: [accessory_type]

submittals:
  - id: 10ta.sub.product-data
    type: Product Data
    must_show:
      - Each accessory marked to its type tag, with mounting (surface, semi-recessed, recessed), rough opening and wall depth
      - Rated or non-rated construction for units recessed in rated walls
      - Power requirements and connection type for powered units
  - id: 10ta.sub.schedule
    type: Schedule
    must_show:
      - Accessory schedule by room with type, quantity and mounting height to the operable part or outlet

review_checks:
  - id: 10ta.mounting-heights
    kind: conformance
    check: >
      Mounting heights and positions on the elevations put dispenser outlets,
      towel and soap controls, mirror bottom edges, coat hooks and shelves
      within the reach and height limits of the accessibility standard, and
      nothing sits inside the clear space required above and below grab bars.
      Heights are checked to the operable part, not to the top of the unit.
    trace_to: [drawings.interior_elevations, drawings.enlarged_plans]
    severity: high
    owner: subcontractor

  - id: 10ta.grab-bars
    kind: conformance
    check: >
      Grab bar lengths, positions, diameter, wall clearance and structural
      strength match the standard and the elevations, and the rear bar does
      not conflict with the flush valve; where the valve sits on the wall
      side, the standard's allowance for splitting or shifting the bar is
      applied deliberately, not in the field.
    trace_to: [drawings.interior_elevations, drawings.plumbing]
    severity: high
    owner: subcontractor

  - id: 10ta.owner-dispensers
    kind: coordination
    scope: package
    check: >
      Dispensers the owner's supply vendor furnishes are identified, and their
      models, recess sizes and mounting heights are obtained before rough-in,
      so backing, recesses and power match the units that will actually be
      hung.
    trace_to: [spec.part1, schedule.toilet_accessories]
    severity: medium
    owner: gc
    gate: in_wall_rough_in

  - id: 10ta.powered-units
    kind: coordination
    check: >
      Hand dryers and powered dispensers show hardwired or battery operation,
      voltage and load, and the connection box location and height; the
      electrical drawings carry a circuit and box at that point and height.
    trace_to: [drawings.electrical, drawings.interior_elevations]
    severity: medium
    owner: gc
    gate: in_wall_rough_in

  - id: 10ta.required-items
    kind: absence
    scope: package
    check: >
      The schedule includes the items codes and the program require that plans
      often leave out: diaper changing stations in the toilet rooms that need
      them, accessible units of each accessory type, and shower seats and
      grab bars at accessible showers.
    trace_to: [schedule.toilet_accessories, drawings.enlarged_plans]
    severity: medium
    owner: design_team

reconciliations:
  - id: 10ta.rc.fixture-counts
    between: [schedule.toilet_accessories, schedule.plumbing_fixture, drawings.enlarged_plans]
    key: Toilet room
    fields: [lavatories, water closets, urinals, compartments, quantity of each accessory type]
    check: >
      Accessory quantities in each room follow its fixtures: dispensers per
      lavatory, tissue dispensers per water closet, disposal units per
      compartment where the program requires them, and grab bar sets per
      accessible fixture.
    severity: medium
    owner: gc
    gate: procurement_release

failure_modes:
  - id: 10ta.fm.short-counts
    what_happens: Accessories ordered from a schedule that undercounts dispensers per lavatory or leaves out disposal units in compartments
    consequence: Late orders and a punch list that holds turnover of the toilet rooms
    caught_by: [10ta.rc.fixture-counts]
    source: industry_practice

  - id: 10ta.fm.dispenser-in-grab-bar-space
    what_happens: Tissue or seat cover dispenser mounted inside the clear space above or below the grab bar
    consequence: Fails the accessibility inspection; dispensers relocated and tile patched
    caught_by: [10ta.mounting-heights]
    source: field_experience

  - id: 10ta.fm.flush-valve-conflict
    what_happens: Flush valve roughed in on the wall side where the rear grab bar runs
    consequence: Grab bar cut or shifted in the field, or the valve re-piped through finished walls
    caught_by: [10ta.grab-bars, if.10-toilet-room-fixtures]
    source: field_experience

  - id: 10ta.fm.owner-dispenser-late
    what_happens: The owner's supply vendor names its dispensers after close-in
    consequence: Recesses framed for the wrong units, surface units over patched walls, or missing backing
    caught_by: [10ta.owner-dispensers]
    source: field_experience

  - id: 10ta.fm.dryer-box
    what_happens: Hand dryer selected or moved to an accessible height after rough-in, or no circuit carried for it
    consequence: Boxes moved or surface conduit added; dryers left unconnected at turnover
    caught_by: [10ta.powered-units, if.10-powered-accessories]
    source: industry_practice

regulatory_hooks:
  - id: 10ta.rh.toilet-room-accessories
    topic: accessibility-toilet-rooms
    question: >
      What does the adopted accessibility standard require for grab bar
      length, position and strength; for mirror, dispenser, towel, coat hook
      and shelf heights; and for clearances between grab bars and other
      elements?
    applies_when: Toilet and bathing rooms with accessible fixtures
    source_families: [accessibility]
    severity: high

  - id: 10ta.rh.changing-stations
    topic: diaper-changing-stations
    question: >
      Does the adopted building code or other law require diaper changing
      stations in this occupancy, in which toilet rooms, and with what
      accessibility requirements?
    applies_when: Assembly, mercantile and other public-use toilet rooms
    source_families: [building_code, accessibility]
    severity: medium

extract_fields:
  - id: 10ta.xf.mounting
    label: Mounting type, rough opening and recess depth
    type: string
    per: element
    reconcile_against: [schedule.partition_type]
  - id: 10ta.xf.height
    label: Mounting height to the operable part or outlet
    type: string
    per: element
    reconcile_against: [drawings.interior_elevations]
  - id: 10ta.xf.power
    label: Power requirement and connection type
    type: string
    per: element
    reconcile_against: [drawings.electrical]
