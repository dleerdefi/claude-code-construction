schema_version: 1
kind: section
id: "33 10 00"
title: Water Utilities
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: never

scope_summary: >
  Water mains and services, fire service mains, hydrants, valves, meters
  and backflow assemblies on site. Potable lines need disinfection and
  bacteriological results accepted before they are connected to the public
  system or the building, and the purveyor usually makes or witnesses the
  tap. The fire service main follows its own installation standard, and the
  sprinkler design depends on a hydrant flow test that has to be recent and
  taken on the main that serves the building. Thrust restraint and separation
  from sewers are what the inspector looks for in the trench.

submittals:
  - id: wa.sub.product-data
    type: Product Data
    must_show:
      - Pipe, fittings, joint restraint, valves, hydrants and meters, each on the purveyor's approved list
      - Backflow assemblies for the domestic and fire services where they are in this scope
  - id: wa.sub.test-reports
    type: Test Reports
    must_show:
      - Hydrostatic pressure and leakage test results
      - Disinfection, flushing and bacteriological results accepted by the purveyor or health authority
      - The fire service main's material and test certificate, including the flush before connection to the riser

review_checks:
  - id: wa.thrust-restraint
    kind: conformance
    check: >
      Every bend, tee, reducer, dead end, valve and hydrant has thrust
      blocks bearing on undisturbed soil or restrained joints over the
      restrained length calculated for the test pressure and soil; restraint
      is not left to the pipe layer's judgment.
    trace_to: [drawings.civil, drawings.details, spec.part3]
    severity: high
    owner: subcontractor
    gate: trench_backfill

  - id: wa.disinfection
    kind: completeness
    check: >
      Disinfection, flushing and bacteriological sampling by the method the
      purveyor requires are complete and accepted before the new main is
      connected to the public system or the building, and the connection
      method (cut-in, tapping sleeve) and who makes it are agreed with the
      purveyor.
    trace_to: [spec.part3, report.utility_requirements]
    severity: high
    owner: gc

  - id: wa.flow-test
    kind: completeness
    check: >
      The hydrant flow test the fire protection design uses is recent enough
      for the fire code and the reviewing authority, taken on the main that
      serves the building, and still reflects the purveyor's system; a stale
      or remote test is raised before the sprinkler design is submitted.
    trace_to: [drawings.fire_protection, report.utility_requirements]
    severity: high
    owner: gc
    gate: procurement_release

  - id: wa.fire-service
    kind: conformance
    check: >
      The fire service uses pipe, fittings, joint restraint and valves
      approved for fire service (the purveyor's domestic list is not
      enough), and its underground control valves are the type, location and
      supervision the fire code and fire department require.
    trace_to: [drawings.civil, drawings.fire_protection, spec.part3]
    severity: high
    owner: gc

  - id: wa.hydrants-valves
    kind: conformance
    check: >
      Hydrant type, outlet sizes and threads, outlet orientation and
      breakaway features match the fire department and purveyor; hydrants
      and valve boxes are clear of parking stalls, landscaping and walls that
      block access.
    trace_to: [drawings.civil, drawings.site, report.utility_requirements]
    severity: medium
    owner: subcontractor

  - id: wa.meter-backflow
    kind: conformance
    check: >
      Meter and backflow vaults or enclosures have freeze protection, test
      access, and a drain or daylight outlet sized for a reduced pressure
      assembly's relief discharge; a reduced pressure assembly in a pit
      without a drain is rejected.
    trace_to: [drawings.civil, drawings.details, report.utility_requirements]
    severity: medium
    owner: design_team

failure_modes:
  - id: wa.fm.joint-separation
    what_happens: Restraint missing at a fitting; the joint separates under test or service
    consequence: Washout, excavation and repair, sometimes under finished paving
    caught_by: [wa.thrust-restraint]
    source: industry_practice

  - id: wa.fm.bacteria-hold
    what_happens: Main connected before bacteriological results are accepted, or samples fail repeatedly
    consequence: Building water not released; occupancy delayed
    caught_by: [wa.disinfection]
    source: industry_practice

  - id: wa.fm.stale-flow-test
    what_happens: Sprinklers designed on an old or remote flow test, and the actual supply is lower
    consequence: Redesign, larger pipe or a fire pump found late in the job
    caught_by: [wa.flow-test, if.21-fire-service-underground]
    source: industry_practice

  - id: wa.fm.unflushed-service
    what_happens: Fire service connected to the riser without the flush
    consequence: Debris in the sprinkler system; obstructed heads and rework
    caught_by: [if.21-fire-service-underground]
    source: industry_practice

  - id: wa.fm.separation
    what_happens: Water line laid too close to, or under, a sewer without the special construction the rules allow
    consequence: The health authority or purveyor rejects the line and the crossing is rebuilt
    caught_by: [if.33-water-sewer-separation]
    source: industry_practice

  - id: wa.fm.wrong-materials
    what_happens: Fire service built with pipe or valves from the domestic list that are not approved for fire service, or with unsupervised control valves
    consequence: Rejected at the fire inspection; valves or pipe replaced and supervision added late
    caught_by: [wa.fire-service]
    source: industry_practice

  - id: wa.fm.rp-in-pit
    what_happens: Reduced pressure assembly placed in a vault with no drain
    consequence: Vault floods on relief discharge; the purveyor rejects the installation
    caught_by: [wa.meter-backflow]
    source: industry_practice

standards:
  - id: wa.std.awwa-c600
    name: AWWA C600
    title: Installation of Ductile-Iron Mains and Their Appurtenances
    verify: Installation, restraint and hydrostatic testing of ductile iron mains
  - id: wa.std.awwa-c605
    name: AWWA C605
    title: Underground Installation of Polyvinyl Chloride (PVC) and Molecularly Oriented Polyvinyl Chloride (PVCO) Pressure Pipe and Fittings
    verify: Installation and hydrostatic testing of PVC pressure mains
  - id: wa.std.awwa-c651
    name: AWWA C651
    title: Disinfecting Water Mains
    verify: Disinfection, flushing and sampling method where the purveyor does not set its own
  - id: wa.std.nfpa-24
    name: NFPA 24
    title: Standard for the Installation of Private Fire Service Mains and Their Appurtenances
    verify: Fire service main materials, flushing, hydrostatic test and certificate
  - id: wa.std.nfpa-291
    name: NFPA 291
    title: Recommended Practice for Water Flow Testing and Marking of Hydrants
    verify: How the flow test the sprinkler design relies on was performed

regulatory_hooks:
  - id: wa.rh.fire-hydrants
    topic: fire-hydrant-spacing-fire-flow
    question: >
      What fire flow, hydrant spacing, distance from the building and from
      the fire department connection, and hydrant type do the fire code and
      the fire department require, and how recent must the flow test used
      for sprinkler design be?
    applies_when: New buildings, hydrants or fire service mains
    source_families: [fire_code, public_works]
    severity: high

  - id: wa.rh.separation
    topic: water-sewer-separation
    question: >
      What horizontal and vertical separation between water lines and
      sanitary or storm sewers do the state drinking water rules and the
      plumbing code require, and what construction is allowed where it
      cannot be met?
    applies_when: Water lines near or crossing sewers
    source_families: [public_health, plumbing_code]
    severity: high

  - id: wa.rh.disinfection
    topic: potable-water-main-disinfection
    question: >
      Which agency accepts disinfection and bacteriological testing of new
      water mains and services here, by which method and sampling, and who
      takes the samples?
    applies_when: New or extended potable water lines
    source_families: [public_health, public_works]
    severity: medium

  - id: wa.rh.service-backflow
    topic: service-backflow-prevention
    question: >
      What backflow protection do the purveyor's cross-connection program
      and the plumbing code require on the domestic and fire services for
      this occupancy (assembly type, location, enclosure, testing and
      registration)?
    applies_when: New domestic or fire services
    source_families: [plumbing_code, public_works, fire_code]
    severity: high

extract_fields:
  - id: wa.xf.flow-test
    label: Flow test date, hydrant locations, static and residual pressure and flow
    type: string
    per: package
    reconcile_against: [drawings.fire_protection]
  - id: wa.xf.services
    label: Domestic and fire service sizes and materials at the building line
    type: list
    per: package
    reconcile_against: [drawings.plumbing, drawings.fire_protection]
