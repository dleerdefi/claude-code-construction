scope_summary: >
  Gypsum board, trim, joint treatment and finishing, reviewed with the
  partition types and ceilings they build (09 21 16). The board-specific
  decisions are the board type per exposure and per listed design, the
  finish level under critical light, control joints, and backers behind tile
  in wet areas, which may be specified here, in backing boards (09 28 00) or
  with the tile.
