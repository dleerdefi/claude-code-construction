schema_version: 1
kind: section
id: "06 17 00"
title: Shop-Fabricated Structural Wood
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: sometimes   # truss and I-joist layouts are usually the supplier's; structural composite lumber and mass timber panels are usually sized by the engineer of record

scope_summary: >
  Engineered wood members made in the shop: structural composite lumber,
  wood I-joists and metal-web joists, rim boards, cross- and dowel-laminated
  timber panels, and trusses (06 17 53 carries the truss design review).
  Each member's capacity holds only if it is cut, drilled and supported
  exactly as the manufacturer or designer allows, so the review is about
  holes and bearing: MEP routing settled before the layout is released,
  point loads carried down through the details the manufacturer requires,
  and no member cut in the field to make a pipe or duct fit.

suppress:
  - id: 06rc.blocking-master-list
    reason: Engineered member submittals do not carry blocking; the master list is reviewed under 06 10 00
  - id: 06rc.backing-in-rated-walls
    reason: Blocking inside partitions is reviewed under 06 10 00
  - id: 06rc.rc.blocking-sources
    reason: Blocking reconciliation is reviewed under 06 10 00
  - id: 06rc.fm.backing-missed
    reason: Its catching checks are reviewed under 06 10 00
  - id: 06rc.fm.blocking-voids-listing
    reason: Its catching check is reviewed under 06 10 00

submittals:
  - id: 06sf.sub.shop-drawings
    type: Shop Drawings
    must_show:
      - Member layout keyed to the structural drawings, with bearing, hangers, blocking, and the squash blocks, web stiffeners or rim details at every point load
      - Hole zones, web openings or panel penetrations allowed in each member, and the MEP routes they serve
  - id: 06sf.sub.product-data
    type: Product Data
    must_show:
      - Evaluation report or design values for each engineered member, with the hole chart and installation details the capacities depend on

review_checks:
  - id: 06tr.layout-vs-mep
    kind: coordination
    check: >
      The member layout (spacing, depth, truss webs, I-joist hole zones,
      openings through mass timber panels) leaves paths for the duct mains,
      waste lines and vents, sprinkler mains and equipment access the MEP
      drawings route through it; conflicts are solved in the layout or the
      member design before release, not by cutting members in the field.
    trace_to: [drawings.mechanical, drawings.plumbing, drawings.fire_protection, drawings.structural]
    severity: high
    owner: gc
    gate: procurement_release

  - id: 06sf.point-loads
    kind: conformance
    submittal_types: [Shop Drawings]
    check: >
      Every point load from posts, girders and bearing walls above, and every
      bearing on walls and beams, is carried by the squash blocks, web
      stiffeners, blocking panels, rim and hanger details the manufacturer
      requires for that member, and the layout shows them at each location
      on the structural drawings.
    trace_to: [drawings.structural, spec.part2]
    severity: high
    owner: subcontractor
    gate: procurement_release

  - id: 06tr.field-modification
    kind: constructability
    check: >
      No truss, I-joist, structural composite lumber member or mass timber
      panel is cut, notched or drilled in the field beyond the manufacturer's
      hole chart or the approved penetrations without a repair detail from
      the member's designer, and members damaged in handling are reported
      before they are covered.
    trace_to: [spec.part3, drawings.structural]
    severity: high
    owner: gc
    gate: above_ceiling_close_in

failure_modes:
  - id: 06tr.fm.webs-cut
    what_happens: Truss webs or chords, I-joist flanges or engineered lumber cut in the field for a duct, drain, vent or attic access
    consequence: Engineered repairs member by member and a held-up cover inspection, or a sagging floor found at finishes
    caught_by: [06tr.field-modification, 06tr.layout-vs-mep]
    source: industry_practice

  - id: 06sf.fm.point-load-crush
    what_happens: Squash blocks, web stiffeners or blocking left out under posts and bearing walls from the floors above
    consequence: Crushed flanges and rim, floors that settle under the load; framing opened and reinforced after finishes
    caught_by: [06sf.point-loads]
    source: industry_practice

extract_fields:
  - id: 06sf.xf.members
    label: Member type, depth and spacing per area, with allowed hole zones
    type: list
    per: package
    reconcile_against: [drawings.structural]
