schema_version: 1
kind: division
id: "06"
title: Wood, Plastics, and Composites
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

scope_summary: >
  Rough carpentry and wood framing, sheathing, shop-fabricated and
  glued-laminated structural wood, finish carpentry and architectural
  woodwork, and plastic and composite fabrications. Two different reviews
  share this division. Structural and rough wood is about treatment,
  fasteners, delegated truss design, and the blocking no single drawing
  shows. Architectural woodwork is about the AWI standard and grade the spec
  cites, veneer, finishing, and the building conditions wood needs. Casework
  may be specified here (06 41 00, or inside 06 40 23) or in Division 12;
  check both.

review_checks:
  - id: d06.certified-wood
    kind: completeness
    submittal_types: [LEED Submittals, Certificates]
    check: >
      Where the spec requires certified wood, recycled content, or composite
      wood without added formaldehyde, the submittal carries the
      chain-of-custody certificate, product certifications and invoice
      documentation the program needs for each product it applies to. The
      documentation has to be collected at purchase; it cannot be recreated.
    trace_to: [spec.part1, spec.part2]
    severity: medium
    owner: subcontractor
    gate: procurement_release

  - id: d06.fire-retardant-products
    kind: conformance
    check: >
      Fire-retardant-treated wood and fire-rated panel products carry the
      treater's or manufacturer's label or certificate with the
      classification, are the exterior type wherever they can get wet, and are
      cut, ripped or milled only as the treatment's listing allows.
    trace_to: [spec.part2]
    severity: high
    owner: subcontractor

failure_modes:
  - id: d06.fm.certificates-lost
    what_happens: Certified wood bought without chain-of-custody documentation on the invoices
    consequence: The green-building credit is lost and cannot be recovered after purchase
    caught_by: [d06.certified-wood]
    source: industry_practice

  - id: d06.fm.frt-ripped
    what_happens: Fire-retardant-treated lumber ripped or milled on site, or interior-type treatment used where it gets wet
    consequence: The treatment no longer meets its classification; material replaced at inspection
    caught_by: [d06.fire-retardant-products]
    source: industry_practice

standards:
  - id: d06.std.astm-e84-e2768
    name: ASTM E84 / ASTM E2768
    title: Surface burning characteristics of building materials, and the extended-duration tunnel test used to classify fire-retardant-treated wood
    verify: Flame spread classification and fire-retardant-treated wood claims

regulatory_hooks:
  - id: d06.rh.formaldehyde
    topic: composite-wood-formaldehyde
    question: >
      Which formaldehyde emission rule governs the particleboard, MDF and
      hardwood plywood in this woodwork or carpentry, is each product labeled
      or certified to it, and does the spec impose a stricter limit such as
      no added urea-formaldehyde?
    applies_when: Composite wood panels or cores in woodwork, casework or rough carpentry
    source_families: [environmental]
    severity: low
