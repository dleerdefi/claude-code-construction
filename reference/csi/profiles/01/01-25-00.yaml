schema_version: 1
kind: section
id: "01 25 00"
title: Substitution Procedures
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

scope_summary: >
  The substitution request is reviewed before the product is: whether a
  request is allowed at this point at all (the timing window and the cause
  Division 01 requires), and what else the change touches. Substitutions go
  wrong downstream, after approval: different weight, footprint, utilities,
  connections, tested assemblies, warranties or certification credits that
  other trades and documents relied on. The request has to carry the cost of
  that cascade, including the design team's redesign.

submittals:
  - id: 01sub.sub.request
    type: Product Data
    must_show:
      - The specified product and the proposed one compared attribute by attribute, with every difference stated, not only the favorable ones
      - The cause for the request and its evidence (unavailability, schedule, cost), where Division 01 allows substitutions after award only for cause
      - Effects on other work - weight, dimensions, utilities, connections, supports, tested or listed assemblies, warranties, schedule
      - Who pays for the design team's redesign and the other trades' changes

review_checks:
  - id: 01sub.timing-and-cause
    kind: conformance
    check: >
      The request falls inside the window Division 01 allows (before bid,
      within a stated period after award, or later only for cause) and meets
      the conditions for cause it sets. A late request for convenience is
      returned without technical review.
    trace_to: [spec.division_01]
    severity: high
    owner: gc
    gate: procurement_release

  - id: 01sub.cascade
    kind: coordination
    check: >
      Every document and trade the substitution touches is identified and
      routed for review: structural support and weight, openings and
      clearances, electrical and plumbing characteristics, controls, fire-
      rated or tested assemblies the product is part of, adjacent warranties,
      and green building documentation. Approval by one reviewer without the
      others is not an approval.
    trace_to: [register.substitutions, drawings.structural, drawings.electrical, drawings.mechanical,
               drawings.plumbing]
    severity: high
    owner: gc
    gate: procurement_release

  - id: 01sub.equivalence-evidence
    kind: completeness
    check: >
      Claims of equal performance rest on the same test methods, reporting
      basis and product size or configuration the spec uses for the
      specified product. Data from another test standard or another model in
      the family does not show equivalence.
    trace_to: [spec.part2]
    severity: medium
    owner: subcontractor

  - id: 01sub.redesign-cost
    kind: coordination
    check: >
      Where the substitution needs redesign (support framing, electrical
      service, layout, structural connections), the request says who bears
      the design team's fees and the other trades' added cost, and that
      matches what Division 01 says about those costs.
    trace_to: [spec.division_01]
    severity: medium
    owner: gc

  - id: 01sub.owner-standards
    kind: coordination
    check: >
      Substitutions that touch an owner standard (controls platform, door
      hardware and keying, lighting controls, security, finishes the owner
      stocks) are accepted by the owner as well as the design team.
    trace_to: [spec.part2_manufacturers, spec.division_01]
    severity: medium
    owner: gc

  - id: 01sub.formal-acceptance
    kind: completeness
    check: >
      An accepted substitution is recorded by a formal document (substitution
      acceptance, ASI or change order) that the record documents carry; a
      stamped product submittal of a non-specified product is not an
      accepted substitution.
    trace_to: [register.substitutions, register.asi_bulletin_log]
    severity: medium
    owner: design_team

reconciliations:
  - id: 01sub.rc.register-vs-log
    between: [register.substitutions, register.submittal_log]
    key: Spec section and product
    fields: [product approved in the submittal log, basis of design or listed manufacturer, substitution acceptance reference]
    check: >
      Every product approved in the submittal log that is neither the basis
      of design nor a listed manufacturer has an accepted substitution, and
      every accepted substitution is the product actually submitted.
    severity: high
    owner: gc

failure_modes:
  - id: 01sub.fm.cascade-missed
    what_happens: Substitute equipment approved on performance alone, with a different weight, footprint, electrical characteristics or connection size
    consequence: Supports, feeders and piping connections reworked after the equipment arrives, and a dispute over who pays
    caught_by: [01sub.cascade, 01sub.redesign-cost]
    source: industry_practice

  - id: 01sub.fm.approved-by-stamp
    what_happens: A non-specified product goes through as an ordinary product submittal with no substitution request
    consequence: No contract document records the change; when the product underperforms the stamp is argued as acceptance nobody evaluated
    caught_by: [01sub.formal-acceptance, 01sub.rc.register-vs-log]
    source: industry_practice

  - id: 01sub.fm.unequal-data
    what_happens: Equivalence claimed from data tested to a different standard or on a different model
    consequence: Installed product falls short of the specified performance; replacement or a credit after installation
    caught_by: [01sub.equivalence-evidence]
    source: industry_practice

  - id: 01sub.fm.owner-standard
    what_happens: A substituted controls platform or hardware line outside the owner's standard is approved by the design team alone
    consequence: Owner refuses it at turnover, or inherits a second system to maintain and train on
    caught_by: [01sub.owner-standards]
    source: industry_practice

extract_fields:
  - id: 01sub.xf.differences
    label: Differences from the specified product, as stated by the requester
    type: list
    per: package
    reconcile_against: [spec.part2]
  - id: 01sub.xf.cause
    label: Stated cause for the substitution
    type: string
    per: package
    reconcile_against: [spec.division_01]
