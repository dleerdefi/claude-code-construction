schema_version: 1
kind: section
id: "03 41 00"
title: Precast Structural Concrete
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

scope_summary: >
  Hollow-core planks, double tees, beams, columns, stairs and load-bearing
  wall panels, common in parking structures and plank-on-wall buildings.
  Prestressed pieces cannot be cut freely: every opening, drain and sleeve
  has to be planned around the strands before casting. Camber varies from
  piece to piece and keeps changing, so toppings, finish elevations and
  interfaces with walls and stairs have to absorb it. In parking structures,
  connections, joints and drainage live with chlorides for the life of the
  building.

review_checks:
  - id: 03spc.openings-in-prestressed
    kind: constructability
    check: >
      Openings, cores and sleeves in hollow-core and double tees are on the
      piece drawings within the zones the precaster allows (between strands,
      through the cores, away from bearing), and anything added after casting
      goes to the precaster's engineer before it is cut.
    trace_to: [drawings.plumbing, drawings.mechanical, drawings.electrical, drawings.structural]
    severity: critical
    owner: gc
    gate: procurement_release

  - id: 03spc.camber-topping
    kind: constructability
    check: >
      Differential camber between adjacent pieces and camber growth before
      topping are accounted for in topping thickness, finish floor
      elevations, and the interfaces at walls, doors, stairs and elevators,
      with the minimum topping over the crown confirmed by the engineer.
    trace_to: [drawings.structural, drawings.details, spec.part3]
    severity: high
    owner: design_team
    gate: slab_pour

  - id: 03spc.parking-durability
    kind: conformance
    check: >
      In parking and exterior exposure, connection hardware has the corrosion
      protection the spec requires, joints between tees get the specified
      sealant system, and slopes to drains are built in (tees warped or
      topping sloped) as the drawings intend.
    trace_to: [spec.part2, drawings.plans, drawings.details]
    severity: high
    owner: subcontractor

failure_modes:
  - id: 03spc.fm.strand-cut
    what_happens: An opening cored through a plank or tee in the field, cutting strands
    consequence: Lost capacity in the piece; engineered repair or replacement
    caught_by: [03spc.openings-in-prestressed, d03.coring-scanning, if.03-precast-mep-cast-in]
    source: industry_practice

  - id: 03spc.fm.camber-steps
    what_happens: Adjacent pieces with different camber, topped to a constant thickness or to a level that leaves too little over the crown
    consequence: Steps at joints, thin cracked topping, ponding and trip edges
    caught_by: [03spc.camber-topping]
    source: industry_practice

  - id: 03spc.fm.parking-corrosion
    what_happens: Unprotected flange connectors and failed tee-joint sealants in a parking deck
    consequence: Corroded connections and leaks onto cars and the level below; costly repair under traffic
    caught_by: [03spc.parking-durability]
    source: industry_practice

  - id: 03spc.fm.ponding
    what_happens: Drains placed where the tees were not warped or the topping not sloped to them
    consequence: Ponding, ice and accelerated deterioration
    caught_by: [03spc.parking-durability]
    source: industry_practice

standards:
  - id: 03spc.std.pci-mnl-116
    name: PCI MNL-116
    title: Manual for Quality Control for Plants and Production of Structural Precast Concrete Products
    verify: Plant quality control the spec adopts for structural products
