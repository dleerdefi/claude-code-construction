schema_version: 1
kind: section
id: "11 40 00"
title: Foodservice Equipment
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

review_mode: per_element
element_types: [equipment_item]
contractor_designed: sometimes   # hood suppression, walk-in refrigeration and custom fabrication are vendor-designed

scope_summary: >
  Commercial kitchen and serving equipment, custom stainless fabrication,
  hoods and their suppression, and walk-ins (11 41 00 inherits from here).
  Submittals run to hundreds of item numbers, each with its own power, water,
  waste, gas and exhaust data, and the building trades rough in from the
  consultant's rough-in plans long before the equipment contractor's
  approved data exists. The expensive misses are rough-ins built to symbols,
  floor sinks in the wrong place, hoods and suppression that no longer match
  the appliance line, and make-up air that was never revised.

submittals:
  - id: 11fs.sub.shop-drawings
    type: Shop Drawings
    must_show:
      - Rough-in plans built from the approved equipment, dimensioning every water, waste, gas, steam and electrical connection by item number (height above floor, offset from wall or column, wall or floor)
      - Custom fabrication plans, elevations and sections with drop-in cutouts keyed to the approved model, sinks, faucet locations, utility chases and wall or floor attachment
      - Hood plan and sections per hood section, with the appliance line beneath, overhang, exhaust and supply airflow, static pressure, duct collar size and location
      - Suppression nozzle layout over the actual appliance line, with the gas valve, shutoff interlocks and manual release location
  - id: 11fs.sub.product-data
    type: Product Data
    must_show:
      - Equipment list by item number with quantity, model, options and owner- or contractor-furnished designation
      - Cut sheet per item with nameplate utility data and the food equipment certification
      - Hood listing and suppression system listing

review_checks:
  - id: d11.item-utilities
    override: true
    trace_to: [schedule.foodservice_equipment, drawings.foodservice, drawings.electrical, drawings.plumbing, drawings.mechanical]

  - id: 11fs.walk-ins-included
    kind: completeness
    scope: package
    check: >
      Walk-in coolers and freezers carried in this section are also reviewed
      against the storage equipment profile (11 41 00): floor type and slab
      depression, freezer underfloor heat, condensate, door heaters,
      refrigeration route and sprinklers inside the box, all of which are
      settled before the slab pour, not at the walk-in delivery.
    trace_to: [schedule.foodservice_equipment, drawings.foodservice]
    severity: high
    owner: gc
    gate: slab_pour

  - id: 11fs.rough-in-drawings
    kind: completeness
    scope: package
    submittal_types: [Shop Drawings]
    check: >
      The equipment contractor's rough-in plans cover every item that needs a
      connection, are based on the approved models rather than the bid-stage
      consultant plans, and are issued to the plumbing and electrical trades
      before underslab rough-in. If they arrive after the slab is poured, list
      the floor connections already set and check each one against them.
    trace_to: [drawings.foodservice, drawings.plumbing, drawings.electrical]
    severity: high
    owner: gc
    gate: underslab_rough_in

  - id: 11fs.indirect-waste
    kind: conformance
    check: >
      Every item that must waste indirectly has a receptor with the required
      air gap or air break: a floor sink or receptor located where the item's
      outlet actually lands, reachable for cleaning, not under a walk-in or
      fixed equipment base, and with a grate suited to the discharge.
    trace_to: [drawings.plumbing, drawings.foodservice]
    severity: high
    owner: design_team
    gate: slab_pour

  - id: 11fs.grease-waste
    kind: coordination
    scope: package
    check: >
      Grease-laden fixtures and equipment (pot and prep sinks, floor drains and
      troughs at the cooking line, kettles, tilt skillets, dish areas) route to
      the grease interceptor or grease removal devices, and the interceptor was
      sized from the final fixture and equipment list rather than a
      preliminary one.
    trace_to: [drawings.plumbing, drawings.civil, schedule.foodservice_equipment]
    severity: high
    owner: design_team
    gate: underslab_rough_in

  - id: 11fs.hood-airflow
    kind: conformance
    submittal_types: [Shop Drawings, Product Data]
    check: >
      Each hood section's listing, overhang past the appliances below, exhaust
      and supply airflow, static pressure, and duct collar size and location
      match the mechanical schedule and drawings, and the appliance line under
      it is the one the airflow was selected for. Moving a heavier-duty
      appliance under a hood section changes its airflow.
    trace_to: [schedule.foodservice_equipment, schedule.mechanical_equipment, drawings.mechanical]
    severity: high
    owner: subcontractor
    gate: procurement_release

  - id: 11fs.hood-suppression
    kind: conformance
    check: >
      Suppression for each grease hood covers every appliance in the final
      line-up plus the plenum and duct; on discharge it shuts off fuel and
      power to all appliances under the hood with manual reset, its manual
      release sits on the egress path, and it signals the fire alarm system.
      Appliances on casters have restraints and quick-disconnect gas
      connectors so they go back to their protected positions.
    trace_to: [drawings.foodservice, drawings.fire_protection, drawings.fire_alarm]
    severity: critical
    owner: subcontractor
    gate: procurement_release

  - id: 11fs.type-ii-exhaust
    kind: absence
    check: >
      Dish machines, steamers, combination ovens and other heat- or
      vapor-producing items that the code or manufacturer requires to be
      exhausted have a Type II hood or a direct duct connection on the
      mechanical drawings, sized from the approved unit's vent data.
    trace_to: [drawings.mechanical, schedule.foodservice_equipment]
    severity: medium
    owner: design_team

  - id: 11fs.gas-connections
    kind: conformance
    check: >
      Gas items show input rating, connection size and required inlet
      pressure; movable items use listed flexible connectors with restraint
      cables; and the valve the suppression system closes is upstream of every
      appliance under that hood, with reset accessible.
    trace_to: [drawings.plumbing, drawings.mechanical, drawings.foodservice]
    severity: high
    owner: subcontractor

  - id: 11fs.custom-fabrication
    kind: conformance
    submittal_types: [Shop Drawings]
    check: >
      Custom fabrications show integral sinks and drainboards, faucet and drain
      locations, cutouts sized to the approved drop-in and undercounter
      models, utility chases, edges and wall attachment, in the material
      gauge and construction the spec requires. A drop-in substituted after
      approval needs its cutout re-checked before fabrication.
    trace_to: [drawings.foodservice, spec.part2]
    severity: medium
    owner: subcontractor
    gate: procurement_release

reconciliations:
  - id: d11.rc.electrical
    override: true
    between: [schedule.foodservice_equipment, schedule.electrical_panel, drawings.electrical]
    fields: [voltage, phase, load (amps or kW), receptacle configuration or hardwired, disconnect, circuit, standby branch, shut off by hood suppression]

  - id: d11.rc.plumbing-mechanical
    override: true
    between: [schedule.foodservice_equipment, drawings.plumbing, drawings.mechanical]
    fields: [cold, hot or filtered water and size, water temperature, waste size, direct or indirect waste, grease or non-grease waste, receptor location, gas input and pressure, steam and condensate, backflow protection]

  - id: 11fs.rc.rough-in-locations
    between: [drawings.foodservice, drawings.plumbing, drawings.electrical]
    key: Connection point by item number
    fields: [location, height above floor, wall or floor, floor sink or trench position, receptacle or junction box]
    check: >
      Each connection on the foodservice rough-in plans appears on the
      plumbing and electrical plans at the same location and height. MEP plans
      that show only a generic symbol at the item, rather than the dimensioned
      point, are flagged so the trades rough in from the foodservice plans.
    severity: high
    owner: design_team
    gate: underslab_rough_in

  - id: 11fs.rc.hood-exhaust
    between: [schedule.foodservice_equipment, schedule.mechanical_equipment, drawings.mechanical]
    key: Hood tag and the fans serving it
    fields: [exhaust airflow, make-up or supply airflow, static pressure, exhaust fan served by, make-up air unit served by, duct collar size and count, fan interlock]
    check: >
      Each hood's exhaust and make-up airflow matches the exhaust fan and
      make-up air unit that serve it, the fan's static pressure covers the
      hood and its duct, and total make-up air keeps the kitchen at the
      pressure the design intends relative to the dining and corridor areas.
    severity: high
    owner: design_team
    gate: procurement_release

  - id: 11fs.rc.gas-load
    between: [schedule.foodservice_equipment, drawings.plumbing, drawings.mechanical]
    key: Gas appliance, and the gas service that feeds the kitchen
    fields: [input rating per appliance, connection size, inlet pressure, total connected load, service pressure and meter]
    check: >
      The total input of the final gas line-up stays within what the gas
      piping, regulators and utility service were sized for; higher-input
      substitutions are traced back to the meter.
    severity: medium
    owner: design_team
    gate: procurement_release

failure_modes:
  - id: 11fs.fm.roughed-to-symbols
    what_happens: Plumbing and electrical rough-ins set from MEP plan symbols instead of the dimensioned foodservice rough-in plans
    consequence: Stubs land behind equipment, inside fabricated bases or at the wrong height; slab coring and wall patching before turnover
    caught_by: [11fs.rough-in-drawings, 11fs.rc.rough-in-locations]
    source: industry_practice

  - id: 11fs.fm.floor-sink-misplaced
    what_happens: Floor sinks cast in before equipment approval, ending up under legs, behind fixed equipment or beyond the reach of the item's drain
    consequence: Unusable or uncleanable receptors, health inspection findings, cored and patched floors
    caught_by: [11fs.indirect-waste, 11fs.rc.rough-in-locations]
    source: field_experience

  - id: 11fs.fm.suppression-line-up
    what_happens: Appliances added, swapped or rearranged under the hood after the suppression system was laid out
    consequence: Appliances left unprotected; the system fails its acceptance test or fire inspection
    caught_by: [11fs.hood-suppression]
    source: industry_practice

  - id: 11fs.fm.exhaust-fan-short
    what_happens: Hood sections lengthened or appliance duty raised in the hood submittal, while the exhaust fan is ordered to the bid-stage airflow and static pressure
    consequence: Hoods fail to capture at start-up; smoke and heat roll into the kitchen and the fan is replaced or resheaved
    caught_by: [11fs.rc.hood-exhaust, 11fs.hood-airflow]
    source: industry_practice

  - id: 11fs.fm.dish-vapor
    what_happens: Dish machine or steam equipment venting left unconnected because no Type II hood or duct was drawn
    consequence: Condensation damage to ceilings, lights and finishes; ductwork added after ceilings close
    caught_by: [11fs.type-ii-exhaust]
    source: field_experience

  - id: 11fs.fm.indirect-piping-orphan
    what_happens: Indirect waste piping from equipment outlets to floor sinks claimed by neither the equipment contractor nor the plumber
    consequence: Unconnected drains at the health inspection; last-minute change order
    caught_by: [if.11-foodservice-plumbing]
    source: field_experience

  - id: 11fs.fm.suppression-not-monitored
    what_happens: Hood suppression system not connected to the building fire alarm, or make-up air not shut down on discharge
    consequence: Failed acceptance test and delayed occupancy
    caught_by: [if.11-hood-fire-alarm]
    source: industry_practice

  - id: 11fs.fm.interceptor-preliminary
    what_happens: Grease interceptor sized and set from a preliminary fixture list or the civil drawings before the equipment was final
    consequence: Interceptor rejected by the plumbing or sewer authority, or replaced after site work
    caught_by: [11fs.grease-waste]
    source: industry_practice

  - id: 11fs.fm.cutout-mismatch
    what_happens: Drop-in or undercounter unit substituted after the fabrication drawings were approved
    consequence: Fabricated counters field-cut or rebuilt
    caught_by: [11fs.custom-fabrication, d11.substitution-cascade]
    source: industry_practice

standards:
  - id: 11fs.std.nsf-ansi
    name: NSF/ANSI 2, 3, 4 and 7
    title: Food Equipment; Commercial Warewashing Equipment; Commercial Cooking, Rethermalization, and Powered Hot Food Holding and Transport Equipment; Commercial Refrigerators and Freezers
    verify: Certification of each item to the standard for its category, where the spec or food code requires it
    note: Confirm certification in the certifier's listing, not from a logo on a brochure page

  - id: 11fs.std.ul-710
    name: UL 710
    title: Exhaust Hoods for Commercial Cooking Equipment
    verify: Hood listing and the airflow, overhang and appliance conditions of that listing

  - id: 11fs.std.ul-300
    name: UL 300
    title: Fire Testing of Fire Extinguishing Systems for Protection of Commercial Cooking Equipment
    verify: Suppression system compliance claimed for the cooking line

  - id: 11fs.std.nfpa-96
    name: NFPA 96
    title: Standard for Ventilation Control and Fire Protection of Commercial Cooking Operations
    verify: Hood, grease duct, clearance and shutoff requirements
    note: Confirm the edition the adopted fire and mechanical codes reference

  - id: 11fs.std.nfpa-17a
    name: NFPA 17A
    title: Standard for Wet Chemical Extinguishing Systems
    verify: Wet chemical system design, installation and acceptance testing

regulatory_hooks:
  - id: 11fs.rh.hood-type
    topic: commercial-kitchen-hood-requirements
    question: >
      Which appliances in the final line-up require a Type I hood, a Type II
      hood or no hood under the adopted mechanical code, and how does the AHJ
      treat listed recirculating or ventless appliances?
    applies_when: Any commercial cooking, dishwashing or steam-producing equipment
    source_families: [mechanical_code, fire_code]
    severity: high

  - id: 11fs.rh.hood-suppression
    topic: commercial-kitchen-hood-suppression
    question: >
      What does the adopted fire code require of the cooking-line suppression
      system (listing standard, fuel and power shutoff, manual release
      location, fire alarm connection, portable extinguisher type), and which
      acceptance test does the fire marshal witness?
    applies_when: Type I hoods over grease-producing appliances
    source_families: [fire_code]
    severity: critical

  - id: 11fs.rh.makeup-air
    topic: kitchen-exhaust-makeup-air
    question: >
      What make-up air, interlock and pressure relationship does the adopted
      mechanical code require for kitchen exhaust, and above what exhaust rate
      does the energy code require demand control, transfer air or heat
      recovery?
    applies_when: Kitchen exhaust hoods
    source_families: [mechanical_code, energy]
    severity: medium

  - id: 11fs.rh.grease-interceptor
    topic: grease-interceptor-sizing
    question: >
      How do the adopted plumbing code and the local sewer authority size and
      locate grease interceptors and grease removal devices, which fixtures
      must or must not discharge to them (dish machines, food waste
      disposers), and is a pretreatment permit required?
    applies_when: Any kitchen with grease-producing operations
    source_families: [plumbing_code, environmental]
    severity: high

  - id: 11fs.rh.indirect-waste
    topic: foodservice-indirect-waste
    question: >
      Which foodservice items must discharge through an indirect waste with an
      air gap or air break under the adopted plumbing and food codes?
    applies_when: Kitchens, bars and serving areas with refrigerated, ice, steam or sink equipment
    source_families: [plumbing_code, food_code]
    severity: high

  - id: 11fs.rh.equipment-certification
    topic: food-equipment-certification
    question: >
      Does the adopted food code or health authority require food equipment
      to be certified to the applicable NSF/ANSI standard or an equivalent, and
      must the equipment plan be approved before fabrication or installation?
    applies_when: Any food establishment under health department permit
    source_families: [food_code]
    severity: high

  - id: 11fs.rh.accessible-service
    topic: accessibility-work-surfaces
    question: >
      Do self-service lines, tray slides, condiment and beverage dispensers
      and service counters meet the adopted accessibility standard for
      height, reach range and clear floor space?
    applies_when: Cafeteria and self-service lines, bars and service counters open to the public
    source_families: [accessibility]
    severity: medium

extract_fields:
  - id: 11fs.xf.item-list
    label: Item number, quantity, model and furnished-by for every item
    type: list
    per: package
    reconcile_against: [schedule.foodservice_equipment, drawings.foodservice]
  - id: 11fs.xf.gas-input
    label: Gas input rating
    type: number
    unit: Btu/h
    per: element
    reconcile_against: [drawings.plumbing, drawings.mechanical]
  - id: 11fs.xf.hood-data
    label: Hood section exhaust and supply airflow, static pressure and collar size
    type: list
    per: element
    reconcile_against: [schedule.mechanical_equipment]
  - id: 11fs.xf.certification
    label: Food equipment certification claimed
    type: string
    per: element
    reconcile_against: [spec.part2]
