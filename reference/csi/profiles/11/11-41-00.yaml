schema_version: 1
kind: section
id: "11 41 00"
title: Foodservice Storage Equipment
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

equivalents: ["13 21 26"]   # walk-ins are sometimes specified as cold storage rooms
element_types: [walk_in_box]

scope_summary: >
  Walk-in coolers and freezers, refrigerated storage cases and shelving
  (11 41 23 and 11 41 26 inherit from here). A walk-in is a small building
  inside the building: its floor, slab depression, vapor control, underfloor
  heat, refrigeration, condensate, door heaters, sprinklers and lights are
  split among the concrete, refrigeration, plumbing, electrical and fire
  protection trades, and most of those decisions are fixed at the slab pour.
  A freezer on grade without working underfloor heat heaves its own floor,
  and the repair means removing the box.

