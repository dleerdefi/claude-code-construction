schema_version: 1
kind: section
id: "07 92 00"
title: Joint Sealants
status: draft
maintainers: [dleerdefi]
reviewed_by: []
last_reviewed: null

contractor_designed: never

scope_summary: >
  Exterior and interior joint sealants. Sealant cannot fix a joint that is too
  narrow for the movement, and it fails by adhesion on substrates nobody
  tested: coated metals, stone, other manufacturers' membranes. Exterior work
  depends on access equipment, so testing and repairs have to happen before
  the lifts and scaffolds leave.

submittals:
  - id: js.sub.product-data
    type: Product Data
    must_show:
      - Each sealant, primer and joint backing, mapped to the joint types it is used in
  - id: js.sub.test-reports
    type: Test Reports
    must_show:
      - Manufacturer's adhesion and compatibility testing on the project's actual substrates
      - Staining tests for porous stone where it occurs
  - id: js.sub.samples
    type: Samples
    must_show:
      - Colors for selection

review_checks:
  - id: js.joint-schedule
    kind: completeness
    check: >
      Each sealant joint type in the details (exterior perimeter, expansion,
      control, interior wet, acoustic) maps to a sealant suitable for its
      substrates and movement, and no joint type is left unassigned.
      Fire-rated joints are listed systems under 07 84 00, not sealant joints.
    trace_to: [drawings.details, spec.part2]
    severity: medium
    owner: subcontractor

  - id: js.adhesion-testing
    kind: conformance
    submittal_types: [Test Reports]
    check: >
      Laboratory adhesion testing covers the project's actual substrates
      (factory coatings, metal finishes, stone, masonry), with the primers the
      results require and staining tests on porous stone.
    trace_to: [spec.part1, spec.part2]
    severity: high
    owner: subcontractor
    gate: procurement_release

  - id: js.joint-sizing
    kind: constructability
    check: >
      Joint widths shown can take the movement their substrates will produce;
      joints drawn at a default width rather than designed are raised with the
      design team.
    trace_to: [drawings.details]
    severity: medium
    owner: design_team

  - id: js.drainage-paths
    kind: absence
    check: >
      Weeps, sill pan and end dam outlets, flashing drips and curtain wall
      drainage are identified as do-not-seal on the drawings or shop drawings,
      and the sealant installer knows where they are.
    trace_to: [drawings.details, drawings.wall_sections]
    severity: high
    owner: gc

  - id: js.field-adhesion
    kind: completeness
    check: >
      Field adhesion tests at the start of work and at intervals are
      scheduled, with repairs finished before lifts or scaffolds are removed.
    trace_to: [spec.part3, schedule.master]
    severity: medium
    owner: gc


failure_modes:
  - id: js.fm.untested-substrate
    what_happens: Sealant installed without adhesion testing on coated or unusual substrates
    consequence: Widespread adhesive failure after the first seasonal cycle
    caught_by: [js.adhesion-testing, js.field-adhesion, if.sealant-substrates]
    source: industry_practice

  - id: js.fm.stone-staining
    what_happens: Sealant never tested for staining used on porous stone
    consequence: Permanent staining along every joint
    caught_by: [js.adhesion-testing]
    source: industry_practice

  - id: js.fm.sealed-weeps
    what_happens: Sealant run continuously over weeps, sill pan outlets or curtain wall drainage
    consequence: Water trapped inside the wall or frame; leaks and corrosion that look like failed flashing
    caught_by: [js.drainage-paths]
    source: industry_practice

  - id: js.fm.access-gone
    what_happens: Exterior joints inspected after the scaffolds or lifts are gone
    consequence: Repairs need new access equipment
    caught_by: [js.field-adhesion]
    source: industry_practice


standards:
  - id: js.std.astm-c920
    name: ASTM C920
    title: Elastomeric Joint Sealants
    verify: Type, grade, class and use designations claimed
  - id: js.std.astm-c1193
    name: ASTM C1193
    title: Use of Joint Sealants
    verify: Joint design and installation practice the spec references
  - id: js.std.astm-c1521
    name: ASTM C1521
    title: Evaluating Adhesion of Installed Weatherproofing Sealant Joints
    verify: Field adhesion test method
  - id: js.std.astm-c1248
    name: ASTM C1248
    title: Staining of Porous Substrate by Joint Sealants
    verify: Staining tests on stone

regulatory_hooks:
  - id: js.rh.voc
    topic: sealant-voc-limits
    question: >
      What VOC limits apply to sealants and primers on this project (regional
      air quality rules, a green building program the spec names)?
    applies_when: Interior sealants, and any project under regional VOC rules
    source_families: [environmental]
    severity: low

extract_fields:
  - id: js.xf.joint-map
    label: Sealant product per joint type and substrate
    type: list
    per: package
    reconcile_against: [drawings.details, spec.part2]
