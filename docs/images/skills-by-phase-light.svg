<title id="g001-title">Skills by project phase</title>
<desc id="g001-desc">A schedule-style chart of the fourteen skills across four project phases: setup, preconstruction, buyout and construction. Setup splits the drawing set and project manual; document review extracts schedules, counts tags, researches codes and checks coordination; buyout builds the submittal register, tabulates and evaluates bids and writes the subcontract; contract administration reviews submittals and drafts RFIs. The operating guide underlies every phase.</desc>
