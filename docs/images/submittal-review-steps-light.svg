<svg xmlns="http://www.w3.org/2000/svg" width="900" height="606" viewBox="0 0 900 606" role="img" aria-labelledby="g003-title g003-desc" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="g003-title">Inside a submittal review</title>
<desc id="g003-desc">The nine steps of a submittal review. The contract documents feed step 2, which traces every required element before the submittal is opened; the submittal feeds step 3, the inventory. Step 4 is a hold point where the PE confirms facility type, jurisdiction and code research. Step 5 reviews each element against every governing reference, in parallel for large packages. Steps 6 and 7 reconcile documents and route coordination to trades. Step 8 is a completeness gate that re-runs until nothing is unaccounted for. Step 9 drafts the GC review, a marked-up PDF and issues for RFIs; the PE decides the disposition and sends it.</desc>
