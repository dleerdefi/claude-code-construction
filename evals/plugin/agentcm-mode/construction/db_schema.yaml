# AgentCM Database Schema Reference
# Generated by AgentCM — do not edit manually
# Gives Claude Code a complete map of available data

tables:
  sheets:
    description: "All project sheets with metadata"
    key_columns: [id, sheet_number, discipline]
    example_query: "SELECT sheet_number, sheet_title, discipline FROM sheets WHERE project_id = 'd711d6c2-44d0-4345-bb05-08888235cf4f' ORDER BY discipline, sheet_number"

  graph_elements:
    description: "Door, element and equipment tags a person accepted in AgentCM (rooms are in graph_room_tags and rooms, callouts in callout_edges, views in graph_views, grid lines in graph_grid_lines)"
    key_columns: [id, sheet_id, element_type, tag_number]
    filterable: [element_type, tag_number]
    example_query: "SELECT element_type, tag_number FROM graph_elements WHERE sheet_id = :id"

  rooms:
    description: "Room entities with level assignments"
    key_columns: [id, number, name, level_id]
    note: "JOIN to levels table for level name. number is the room number, name is the room name."
    example_query: "SELECT r.number, r.name, l.name AS level FROM rooms r LEFT JOIN levels l ON l.id = r.level_id WHERE r.project_id = 'd711d6c2-44d0-4345-bb05-08888235cf4f'"

  schedule_cells:
    description: "Schedule data at cell level (entity-attribute-value pattern)"
    key_columns: [id, schedule_row_id, column_key, cell_value]
    important_flags:
      is_user_override: "TRUE = PE manually corrected this value. Protected from re-extraction overwrite."
      source: "'extraction' | 'user_edit' | 'reconciliation'"
    note: "JOIN through schedule_rows → schedules for schedule_type and entity_identifier (row key)."
    example_query: "Use v_schedule_pivot view instead of direct table queries."

  schedule_rows:
    description: "Schedule rows linking cells to schedules"
    key_columns: [id, schedule_id, entity_identifier, is_deleted]
    note: "entity_identifier is the row key (e.g., room number, door mark). is_deleted for soft-delete."

  schedules:
    description: "Schedule metadata (type, title, source sheet)"
    key_columns: [id, project_id, sheet_id, schedule_type, title]

  schedule_change_log:
    description: "Audit trail of all schedule data mutations"
    key_columns: [schedule_id, change_type, change_source]
    note: "Read-only historical record. Use for revision diffs and PE correction audits."

  schedule_conflicts:
    description: "Unresolved disagreements between re-extraction and PE overrides"
    key_columns: [row_key, column_key, user_value, extracted_value, status]
    note: "Query WHERE status = 'open' for outstanding conflicts."

  entity_edges:
    description: "Graph relationships between entities (sheets, rooms, elements, schedules)"
    key_columns: [source_id, source_type, target_id, target_type, edge_type]
    edge_types: [references, contains, located_on, scheduled_in]

  callout_edges:
    description: "Cross-sheet reference callouts"
    key_columns: [source_sheet_id, destination_sheet, destination_detail, resolved]
    example_query: "Use v_cross_references view instead of direct table queries."

  extracted_items:
    description: "Every line of text on each sheet (from the text layer, OCR, drawn or corrected in the editor) with its box (normalized 0-1): the same text as .construction/sheets/<sheet>.tsv. Rows with is_deleted = true were deleted in the editor."
    key_columns: [id, sheet_id, text, x_min, y_min, x_max, y_max]
    filterable: [text, sheet_id]
    example_queries:
      text_anchor: "SELECT id, text, x_min, y_min, x_max, y_max FROM extracted_items WHERE sheet_id = '<sheet_uuid>' AND is_deleted = false AND text ILIKE '%FREEZER%'"
      spatial_neighborhood: "SELECT id, text, x_min, y_min, x_max, y_max FROM extracted_items WHERE sheet_id = '<sheet_uuid>' AND is_deleted = false AND x_min BETWEEN 0.2 AND 0.4 AND y_min BETWEEN 0.3 AND 0.5"
    note: "Coordinates are normalized 0-1 (top-left origin). Use for joins and spatial queries; to search the text, the sheet files are faster."

views:
  note: "Every view has project_id first: filter on project_id = 'd711d6c2-44d0-4345-bb05-08888235cf4f'; one database serves several projects."
  v_room_profile: "All data for a room across sheets and schedules. Filter by project_id and room_number."
  v_sheet_contents: "All elements on a given sheet. Filter by project_id and sheet_number."
  v_schedule_pivot: "Schedule data in readable tabular form. Filter by project_id, schedule_type, row_key."
  v_cross_references: "Sheet-to-sheet reference map via callouts, targets found within the project. Filter by project_id, from_sheet or to_sheet."
  v_open_conflicts: "Unresolved extraction vs user-edit conflicts. Filter by project_id."

write_endpoints:
  schedule_ingest:
    method: POST
    path: "http://localhost:3001/api/projects/d711d6c2-44d0-4345-bb05-08888235cf4f/schedules/ingest"
    description: "Ingest extracted schedule data from skill output"
  schedule_reconcile:
    method: POST
    path: "http://localhost:3001/api/projects/d711d6c2-44d0-4345-bb05-08888235cf4f/schedules/reconcile"
    description: "Apply Excel reconciliation changeset to DB"
  tag_detections_ingest:
    method: POST
    path: "http://localhost:3001/api/projects/d711d6c2-44d0-4345-bb05-08888235cf4f/tag-detections/ingest"
    description: "A skill's tag detections, each by its box on the sheet, as pending cards in AgentCM's review; each detection answered"

static_files:
  start_here: ".construction/INDEX.md"
  sheet_files: ".construction/sheets/<sheet>.txt, .tsv, .rows.txt and .groups.tsv"
  schedule_files: ".construction/schedules/<sheet>-<n>.tsv: one per schedule, legend or keyed-notes table, listed in INDEX.md"
  spec_files: ".construction/specs/<section>.txt"
  references: ".construction/xrefs.tsv"
  identifiers: ".construction/tags.tsv"
  crops: "sh .construction/crop.sh <sheet> <x> <y> <w> <h> (or crop.ps1): a box of a sheet as a PNG in .construction/crops/"
  note: "The text of every sheet and specification section is in these files: search them first. The database holds what AgentCM has linked (rooms, schedules, accepted callouts). A drawing is looked at through crop.sh, a box at a time."
